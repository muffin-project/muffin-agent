<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Muffin continuity</title>
  <desc id="desc">A person at the center of one continuous thread linking messages, calendar, files, work and tools, with a small Muffin character on the thread.</desc>

  <rect width="1400" height="320" rx="28" fill="#F8F5EF"/>

  <!-- one continuous thread -->
  <ellipse cx="700" cy="160" rx="392" ry="112" fill="none" stroke="#D8D1C7" stroke-width="3"/>
  <path d="M329 122 C423 41 541 54 610 78" fill="none" stroke="#D96A3A" stroke-width="5" stroke-linecap="round"/>
  <path d="M790 244 C902 254 1009 229 1071 186" fill="none" stroke="#D96A3A" stroke-width="5" stroke-linecap="round"/>

  <!-- center: human -->
  <circle cx="700" cy="160" r="82" fill="#FFFDF9" stroke="#171714" stroke-width="3"/>
  <circle cx="700" cy="133" r="23" fill="none" stroke="#171714" stroke-width="6"/>
  <path d="M651 214 C658 174 678 158 700 158 C722 158 742 174 749 214" fill="none" stroke="#171714" stroke-width="6" stroke-linecap="round"/>
  <circle cx="700" cy="160" r="100" fill="none" stroke="#D96A3A" stroke-width="2" stroke-dasharray="2 10"/>

  <!-- nodes -->
  <g fill="#FFFDF9" stroke="#171714" stroke-width="3">
    <circle cx="329" cy="122" r="30"/>
    <circle cx="398" cy="226" r="30"/>
    <circle cx="534" cy="61" r="30"/>
    <circle cx="866" cy="61" r="30"/>
    <circle cx="1002" cy="226" r="30"/>
    <circle cx="1071" cy="122" r="30"/>
  </g>

  <!-- message -->
  <path d="M314 112 h30 v19 h-16 l-8 8 v-8 h-6z" fill="none" stroke="#171714" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="323" cy="121" r="2" fill="#D96A3A"/><circle cx="331" cy="121" r="2" fill="#D96A3A"/><circle cx="339" cy="121" r="2" fill="#D96A3A"/>

  <!-- file -->
  <path d="M388 210 h17 l7 7 v24 h-24z M405 210 v8 h8" fill="none" stroke="#171714" stroke-width="3" stroke-linejoin="round"/>
  <path d="M393 226 h13 M393 232 h10" stroke="#D96A3A" stroke-width="3" stroke-linecap="round"/>

  <!-- work/check -->
  <rect x="521" y="48" width="26" height="26" rx="5" fill="none" stroke="#171714" stroke-width="3"/>
  <path d="M527 61 l5 5 10-12" fill="none" stroke="#D96A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- calendar -->
  <rect x="853" y="49" width="26" height="24" rx="4" fill="none" stroke="#171714" stroke-width="3"/>
  <path d="M853 57 h26 M859 45 v8 M873 45 v8" stroke="#171714" stroke-width="3" stroke-linecap="round"/>
  <circle cx="861" cy="64" r="2" fill="#D96A3A"/><circle cx="870" cy="64" r="2" fill="#D96A3A"/>

  <!-- terminal/tool -->
  <rect x="987" y="213" width="30" height="24" rx="5" fill="none" stroke="#171714" stroke-width="3"/>
  <path d="M993 221 l6 4-6 4 M1003 230 h8" fill="none" stroke="#D96A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- memory/provenance -->
  <ellipse cx="1071" cy="113" rx="12" ry="5" fill="none" stroke="#171714" stroke-width="3"/>
  <path d="M1059 113 v16 c0 3 5 5 12 5s12-2 12-5v-16 M1059 121 c0 3 5 5 12 5s12-2 12-5" fill="none" stroke="#171714" stroke-width="3"/>

  <!-- Muffin: small, iconic, pure -->
  <g transform="translate(686 249)">
    <path d="M-22 7 h44 l-5 28 c-1 5-5 8-10 8h-14c-5 0-9-3-10-8z" fill="#D96A3A" stroke="#171714" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-25 9 c-9 0-15-6-15-14 0-7 5-12 12-14 2-8 8-14 17-14 5 0 9 2 12 5 3-3 7-5 12-5 9 0 15 6 17 14 7 2 12 7 12 14 0 8-6 14-15 14z" fill="#FFFDF9" stroke="#171714" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-7" cy="-8" r="3" fill="#171714"/><circle cx="8" cy="-8" r="3" fill="#171714"/>
    <path d="M-12 15 l2 21 M0 15 v23 M12 15 l-2 21" stroke="#171714" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- sparse texture -->
  <g fill="#171714" opacity="0.18">
    <circle cx="195" cy="82" r="2"/><circle cx="231" cy="246" r="2"/><circle cx="1183" cy="78" r="2"/><circle cx="1210" cy="236" r="2"/>
    <circle cx="267" cy="166" r="1.5"/><circle cx="1134" cy="173" r="1.5"/>
  </g>
</svg>
