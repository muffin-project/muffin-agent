<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
  <title id="title">Muffin visual identity v0.1 palette</title>
  <desc id="desc">Ink, Muffin orange, cream, paper and muted line colors.</desc>
  <rect width="1000" height="240" rx="24" fill="#FCF9F5"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#111315">
    <rect x="40" y="48" width="150" height="100" rx="16" fill="#111315"/><text x="40" y="184">Ink · #111315</text>
    <rect x="230" y="48" width="150" height="100" rx="16" fill="#F06B2A"/><text x="230" y="184">Orange · #F06B2A</text>
    <rect x="420" y="48" width="150" height="100" rx="16" fill="#FEF7E8" stroke="#111315"/><text x="420" y="184">Cream · #FEF7E8</text>
    <rect x="610" y="48" width="150" height="100" rx="16" fill="#FCF9F5" stroke="#111315"/><text x="610" y="184">Paper · #FCF9F5</text>
    <rect x="800" y="48" width="150" height="100" rx="16" fill="#D9D3C9"/><text x="800" y="184">Muted · #D9D3C9</text>
  </g>
</svg>
