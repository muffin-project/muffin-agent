<title>Muffin, dentro</title>
<style>
  /* ---------------------------------------------------------------------
     Un taccuino di ingegneria: prosa in un serif da lettura, strumenti in
     monospazio. Il colore porta una sola informazione — il taint, cioè quanto
     un turno si è sporcato — e sale dal grigio-ardesia all'argilla. Il viola,
     che non sta su quella scala, è riservato a ciò che NON esiste: dichiarato
     e non collegato. È l'unica cosa che questo repo teme davvero.
     --------------------------------------------------------------------- */
  :root {

    --t2: #a44f26;
    --t3: #8b3128;
    --assenza: #64499a;
    --assenza-tenue: #e7e0f2;
    --ok: #3a6a45;
    --ombra: 0 1px 2px rgb(23 25 28 / 8%), 0 8px 24px rgb(23 25 28 / 6%);
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Charter, Georgia, serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

      --linea: #2e353d;

      --t1: #d4a43c;

      --ombra: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 28px rgb(0 0 0 / 28%);
    }
  }
  :root[data-theme="dark"] {

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--inchiostro);
    font-family: var(--serif);
    font-size: 16px;

  }
  h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.015em; }

  :focus-visible { outline: 2px solid var(--accento); outline-offset: 2px; border-radius: 3px; }

  .etichetta {
    font-family: var(--mono);

  }

  #app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .rail {
    border-right: 1px solid var(--linea);
    background: var(--carta);
    padding: 22px 0 40px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .marchio { padding: 0 20px 18px; }
  .marchio b { font-size: 19px; font-weight: 600; display: block; letter-spacing: -0.02em; }
  .marchio span { font-size: 12.5px; color: var(--sordo); }

  .voce:hover { color: var(--inchiostro); background: var(--carta2); }

  .voce i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--sordo); margin-left: auto; }

  section { margin-bottom: 46px; }

    font-size: 12px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--sordo); font-weight: 500;
    padding-bottom: 7px; margin-bottom: 18px; border-bottom: 1px solid var(--linea);
  }
  .nota { max-width: 64ch; color: var(--sordo); font-size: 14.5px; margin: -6px 0 18px; }

  /* --- tela dei grafi ------------------------------------------------ */
  .tela { position: relative; overflow-x: auto; padding-bottom: 8px; }
  .tela-int { position: relative; }
  .tela svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .arco { fill: none; stroke: var(--linea-forte); stroke-width: 1.5px; }
  .arco.ramo { stroke-dasharray: 3 3; stroke: var(--sordo); opacity: 0.75; }
  .arco.ritorno { stroke: var(--accento); stroke-width: 1.5px; stroke-dasharray: 5 3; }
  .arco.morto { stroke: var(--assenza); stroke-dasharray: 2 4; }

  .nodo {
    position: absolute; text-align: left;
    background: var(--carta); border: 1px solid var(--linea-forte); border-radius: 6px;
    padding: 9px 11px; box-shadow: var(--ombra); overflow: hidden;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .nodo:hover, .nodo:focus-visible { transform: translateY(-1px); border-color: var(--accento); z-index: 3; }
  .nodo .n { font-family: var(--mono); font-size: 9.5px; color: var(--sordo); letter-spacing: 0.08em; }
  .nodo .t { font-weight: 600; font-size: 13.5px; line-height: 1.3; margin: 1px 0 3px; }
  .nodo .s { font-size: 11.5px; color: var(--sordo); line-height: 1.35; }
  .nodo.ramo { background: var(--carta2); box-shadow: none; border-style: dashed; }
  .nodo.ramo .t { font-weight: 500; font-size: 12px; }
  .nodo.spenta { border-color: var(--assenza); background: var(--assenza-tenue); }
  .nodo.attivo { border-color: var(--accento); box-shadow: 0 0 0 2px var(--accento-tenue), var(--ombra); }
  .nodo .barra { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .nodo.pad { padding-left: 14px; }

  .smorza { opacity: 0.22; filter: saturate(0.3); }
  .evidenzia { box-shadow: 0 0 0 2px var(--accento), var(--ombra); }

  /* --- griglie e schede ---------------------------------------------- */
  .griglia { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); }
  .griglia.larga { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .scheda {
    position: relative; text-align: left; width: 100%;
    background: var(--carta); border: 1px solid var(--linea); border-radius: 7px;
    padding: 12px 13px 12px 16px; box-shadow: var(--ombra);
    transition: border-color 0.12s ease, transform 0.12s ease;
  }
  .scheda:hover, .scheda:focus-visible { border-color: var(--accento); transform: translateY(-1px); }
  .scheda .barra { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 7px 0 0 7px; }
  .scheda h4 { margin: 0 0 3px; font-size: 14.5px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.01em; }
  .scheda p { margin: 0; font-size: 12.5px; color: var(--sordo); line-height: 1.4; }

  .gettone {
    display: inline-flex; align-items: center; gap: 4px;

  /* --- cassetto ------------------------------------------------------- */
  #velo {
    position: fixed; inset: 0; background: rgb(0 0 0 / 34%);

  #cassetto {

    transform: translateX(101%); transition: transform 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);

  }
  #cassetto.su { transform: none; }
  #cassetto h3 { font-size: 21px; font-weight: 600; margin-bottom: 4px; font-family: var(--mono); letter-spacing: -0.02em; }
  #cassetto .occhiello { margin-bottom: 14px; }
  #cassetto p { font-size: 14.5px; line-height: 1.55; }
  #cassetto .chiudi { position: absolute; top: 14px; right: 16px; font-size: 20px; color: var(--sordo); line-height: 1; }
  .campo { margin: 14px 0; }
  .campo > .etichetta { display: block; margin-bottom: 4px; }
  .campo p { margin: 0; }

  .ancora {
    display: block; width: 100%; text-align: left; font-family: var(--mono); font-size: 11.5px;
    padding: 7px 9px; margin-top: 5px; border-radius: 5px;
    background: var(--fondo); border: 1px solid var(--linea); color: var(--accento);
  }
  .ancora:hover { border-color: var(--accento); }
  .ancora .sorgente {
    display: block; margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--linea-forte);
    color: var(--sordo); white-space: pre-wrap; word-break: break-word; font-size: 11px;
  }

  .vuoto { color: var(--sordo); font-size: 13.5px; font-style: italic; }
  .legenda { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 20px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--sordo); }
  .pallino { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .prosa { max-width: 66ch; }
  .prosa p { margin: 0 0 12px; }

  @media (max-width: 880px) {
    #app { grid-template-columns: 1fr; }
    .rail {
      position: static; height: auto; flex-direction: row; align-items: center;
      overflow-x: auto; padding: 10px 12px; gap: 2px; border-right: none; border-bottom: 1px solid var(--linea);

    .voce[aria-current="true"] { border-bottom-color: var(--accento); }
    .voce i { display: none; }
    main { padding: 22px 18px 90px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>

<script>window.MAPPA = {"loop":{"entrypoints":[{"surface":"CLI REPL","fn":"runRepl","file":"cli/repl.ts:100","note":"One session per launch; reads a line from stdin, wraps it in an AbortController, calls runTurn. M5-BIS B11: on a TTY (or unless --no-stream), attaches onDelta and writes the answer to stdout as it forms; otherwise prints result.text once, at the end — either way the same bytes."},{"surface":"muffin run","fn":"runHeadless","file":"cli/run.ts:26","note":"Headless single turn: stdout carries only the answer, stderr carries warnings/spend, exit code encodes TurnResult.stopped (0/1/3/4/5)."},{"surface":"Telegram","fn":"TelegramConnector.run / .handle","file":"connectors/telegram/connector.ts:198","note":"Retries getMe() with capped, jittered backoff until connected or stopped (A1, ADR-0035 Emendamento №3 — a boot-time network gap used to kill this surface for the process's whole life). Then polls getUpdates, durably stores each batch before advancing the offset, then drains pending updates one at a time through handle() -> runTurn."},{"surface":"scheduler","fn":"makeJobRunner","file":"agent/scheduler-run.ts:42","note":"A due cron job runs as {kind:'system',source:'scheduler'} on the host tenant, fresh session per fire, through the same runTurn."},{"surface":"scheduler","fn":"makeAbsenceComposer","file":"agent/observe-run.ts:51","note":"Stage 2 of an inferred absence nudge: writes a goal naming the entity and the statistics, runs it through runTurn with memory disabled for that call, hands back {text, record} so the episode is only persisted after delivery succeeds."},{"surface":"corsia dei turni","fn":"TurnLane.tick / makeLaneRunner","file":"core/turns/lane.ts:86; agent/turn-lane.ts:47; core/gateway/service.ts:252","note":"L'unico ingresso che non parte da un messaggio: batte sul tick del gateway (30s), valuta le barriere a evento dei turni sospesi, poi prende UNA riga da TurnStore.due — registrata da una superficie e mai eseguita (B2), sospesa e scaduta (B3), o lasciata da un processo morto (B5) — e la passa a resumeTurn. Non consegna: l'indirizzo e' il replyTo sulla riga, e la porta e' quella della superficie connessa (cli/surface.ts, connectSurfaces().deliver)."}],"steps":[{"n":1,"id":"message-arrives","title":"Surface receives raw message","file":"connectors/telegram/connector.ts:198-253; cli/repl.ts:255-257","what":"La CLI legge una riga da stdin (rl.question). Telegram fa polling di getUpdates, scrive ogni batch nell'inbox SQLite in una transazione e SOLO DOPO avanza l'offset (updates.ts:81-106) — perche' Telegram non re-invia mai un update confermato. Poi drena i pending uno alla volta.","taint":"non ancora assegnato — deciso al passo successivo da chi sta parlando","branches":[{"cond":"Telegram: l'update non e' testo/allegato riconoscibile (parseUpdate torna null)","goto":"exit","note":"marcato processato e scartato in silenzio, connectors/telegram/connector.ts:223-227 — non raggiunge mai runTurn"}]},{"n":2,"id":"identity-resolved","title":"Principal e tenant risolti","file":"connectors/telegram/connector.ts:153-163; core/surface/types.ts (identify); cli/repl.ts:289; cli/run.ts:66","what":"Chi parla decide il tenant, mai il contenuto del messaggio. Telegram mappa il mittente a owner (chat privata + id utente combaciante) o a member di un tenant per-gruppo (principalFor, che ora e' un adapter sottile sulla regola condivisa `identify` in core/surface/types.ts — la stessa che una seconda superficie deve chiamare per non poter rispondere diversamente sulla stessa domanda). La CLI usa sempre {kind:'owner', connector:'cli', externalId:'local'}. Lo scheduler usa {kind:'system', source:'scheduler'}.","taint":"fissa la base della taint del turno: owner/system=0, member=2 — scritta nella colonna `taint` del record alla creazione e da li' letta a ogni ripresa","branches":[{"cond":"Telegram: installazione non ancora accoppiata e il messaggio sembra un codice di pairing","goto":"exit","note":"consumato da tryPair, non arr e il kernel vede e' derivata dalla dichiarazione stessa della capability (resourceKind/policyArgs), mai indovinata dai nomi degli argomenti. decide() ritorna allow, deny, draft o ask. 'deny' torna un tool_result di errore col codice del kernel. 'draft' e' SEMPRE rifiutato oggi — il registro di undo non esiste, quindi una capability a rischio medio 'undoable' che il kernel intendeva eseguire in modo reversibile torna invece un errore che dice al modello di non riprovare. 'ask' chiama deps.approve se la superficie ne ha uno; altrimenti lancia ApprovalRequired.","taint":"controllata contro snapshot.currentTaint() al momento della decisione — loop.ts:744","branches":[{"cond":"deny","goto":"tool-loop-continues","note":"tool_result di errore col codice del kernel, loop.ts:769-776 — il modello puo' ritentare con qualcos'altro"},{"cond":"draft","goto":"tool-loop-continues","note":"SEMPRE un errore oggi — 'draft_unavailable', loop.ts:777-791"},{"cond":"ask, e deps.approve e' presente","goto":"tool-loop-continues","note":"attende la risposta del terminale; deny->tool_result di errore, allow->prosegue all'esecuzione, loop.ts:792-816"},{"cond":"ask, e deps.approve e' assente","goto":"exit","note":"ApprovalRequired lanciato -> catturato in loop.ts:577-588 -> stopped:'ask', pending porta la richiesta"}]},{"n":13,"id":"tool-executes","title":"Handler eseguito, risultato accodato, il loop riparte","file":"agent/loop.ts:1753","what":"Su allow (o ask approvato), l'handler del tool gira con un ToolContext preso dal turno reale (mai cablato alla registrazione): tenant, principal, turnId, sessionId, taint(), suspend e replyChannel; il suo esito alza sempre la taint dello snapshot con outcome.tier, che ogni tool DEVE dichiarare (campo obbligatorio, ADR-0044) — mai piu' un tool che tace sulla provenienza letto come pulito. Il risultato viene accodato al log della sessione e alla lista tool_result del turno. Dopo che tutte le chiamate del batch sono finite, i risultati vengono accodati com h(): span chiuso, lane di memoria notificata","file":"agent/loop.ts:1653-1707; agent/runtime.ts:619","what":"finish() marca stop reason e conteggio iterazioni sullo span di trace, lo chiude, poi chiama onTurnEnd in modo sincrono e non-bloccante — cablato in produzione a consolidation.notify(tenant), che arma il timer della lane di estrazione memoria. Scatta su ogni fine turno, incluso 'error' e 'aborted', perche' le parole dell'owner erano gia' state registrate prima ancora di chiedere qualcosa al modello.","taint":"n/a","branches":[]},{"n":18,"id":"reply-delivered","title":"La superficie rende e invia la risposta","file":"cli/repl.ts:288-299; cli/run.ts:63-94; connectors/telegram/connector.ts:307-330; agent/scheduler-run.ts:42-55; agent/turn-lane.ts; cli/surface.ts (connectSurfaces)","what":"La CLI REPL stampa result.text su stdout e una riga di stato su stderr se non e' 'answered'. `muffin run` stampa su stdout/stderr e mappa result.stopped su un exit code (0/1/3/4/5). Telegram ferma la presenza effimera, congela in `telegram_delivery_parts` le parti HTML prodotte da renderForTelegram e le invia in ordine: ogni parte ha un claim first-writer-wins; `sent` salta il prefisso gia' confermato, `rejected` puo' essere ritentato, `possibly_sent` ferma il suffisso e non torna mai automaticamente a pending. Un job schedulato passa invece il suo TurnResult a jobOutcomeFromTurn, che diventa una chiamata Deliver — Deliver ora ritorna un DeliveryOutcome (core/surface/types.ts) invece di Promise\u003cvoid>: ogni canale passa dallo stesso SurfaceRegistry (cli/surface.ts, connectSurfaces), che risponde {delivered:true} solo se una superficie reale lo gestisce e {delivered:false, why} altrimenti — mai un'eccezione silenziosa ne' un log che nessuno legge; Scheduler.settle scrive quell'esito sulla riga del turno prima di markRan. Un turno che la CORSIA ha finito non ha pero' nessuno stack a cui tornare: per quello l'indirizzo resta il `replyTo` opaco scritto sulla riga quando il turno e' iniziato (una seconda via di consegna, apposta separata da SurfaceRegistry — un job non ha un messaggio a cui rispondere, un turno ripreso si'), e la porta e' quella della superficie connessa in QUESTO processo (connectSurfaces().deliver; TelegramConnector.deliverTo valida da se' la forma del proprio indirizzo). Un turno chiuso con del testo e NESSUN indirizzo sulla riga emette un LaneEvent `undeliverable` — scritto anche sulla riga (`delivery = 'undeliverable'`) cosi' che doctor e il prossimo boot lo vedano — invece di essere scartato in silenzio.","taint":"n/a","branches":[{"cond":"nessuna superficie del registro gestisce il canale (es. un indirizzo scritto male, o una superficie disabilitata)","goto":"exit","note":"SurfaceRegistry.deliver ritorna {delivered:false, why} con l'elenco delle superfici connesse — core/surface/registry.ts; Scheduler.settle scrive l'esito sulla riga del turno prima di markRan (core/scheduler/scheduler.ts:458)"}]}],"toolCallCycle":{"maxIterations":"profile-dipendente, tetto duro 40 (MAX_ITERATIONS_HARD_CAP, agent/profiles/profile.ts:118); cap effettivo = min(profile.maxToolCallsPerTurn, 40) via iterationCap() (profile.ts:197-199), consultato una volta per turno in agent/loop.ts:338. Profili shippati: consumer-local=15 (agent/profiles/consumer-local.json:6), frontier=30 (agent/profiles/frontier.json:13), fallback CONSERVATIVE=15 (agent/profiles/profile.ts:97)","howDecided":"selectProfile(config.models.main, profiles) confronta l'id del modello configurato coi pattern glob `match` di ogni profilo, primo che combacia vince, altrimenti CONSERVATIVE (agent/profiles/profile.ts:183-188). loadProfiles() legge ogni *.json in agent/profiles/ al boot, scartando (e segnalando in bootLines) qualsiasi file che non passi ProfileSchema (profile.ts:150-181)","whatEndsTheLoop":["'answered': zero tool call in questa iterazione E checkCompletion passa (o e' gia' stato nudged una volta) — agent/loop.ts:540, agent/completion.ts:58-65","'cap': iterations ena prima di finish)"},{"what":"Il provider esaurisce i retry di trasporto (429/5xx persistenti oltre MAX_TRANSPORT_RETRIES=2)","consequence":"Il ProviderError viene rilanciato fuori da runTurn per intero (non torna come TurnResult). Ogni superficie lo gestisce diversamente: cli/repl.ts stampa 'errore: ...' e tiene viva la REPL; cli/run.ts ritorna exit code 1; il drain() del connector Telegram lo cattura per-update, chiama markFailed e lascia l'update pending per un retry al prossimo poll o riavvio.","evidence":"agent/loop.ts:428-442 (retry poi rethrow); cli/repl.ts:300-301; cli/run.ts:73-75; connectors/telegram/connector.ts:230-239"},{"what":"Verdetto 'ask' raggiunto su una superficie/processo senza approvatore cablato","consequence":"ApprovalRequired viene lanciato dentro runTool e trasformato in stopped:'ask' con la richiesta pending allegata. Per un job schedulato diventa un testo di avviso in coda per l'owner ('In coda per te: ...'); per Telegram sotto il processo gateway (cli/gateway.ts non imposta mai deps.approve, letto per intero) e' un vicolo cieco — chi ha chiesto vede solo il testo di rifiuto del kernel e non ha modo di concederla da remoto.","evidence":"agent/loop.ts:792-816, 577-588; agent/scheduler-run.ts:31-39; cli/gateway.ts (cmdGatewayRun, nessuna assegnazione a .approve in tutta la funzione)"},{"what":"Ctrl+C durante un batch di tool call (solo REPL)","consequence":"Le tool call gia' eseguite nel batch corrente mantengono i loro effetti reali (una fs_write e' davvero avvenuta) e sono loggate nel session store da runTool stesso, ma il turno ritorna subito con stopped:'aborted' prima di accodare il batch di risultati accumulato all'array messages del turno — quindi nulla del punto di interruzione sopravvive in un turno successivo tranne cio' che recall riesce a ripescare da sessione/memoria.","evidence":"agent/loop.ts:574 (controllo abort dentro il for delle tool call), 592 (append del batch che un return anticipato salta), 826-834 (append alla sessione avviene dentro runTool, per ogni chiamata)"},{"what":"CHIUSO (era: consegna remota non implementata per nessun canale tranne 'cli'). Un job su un canale non gestito da nessuna superficie del registro ora produce {delivered:false, why} — mai un'eccezione, mai un log muto — e markRan avanza SOLO dopo che Scheduler.settle ha scritto l'esito sulla riga del turno.","consequence":"Resta un buco reale e diverso: Discord non e' ancora una superficie del registro (M5-BIS B15/B16), quindi un job con channel='discord:\u003cid>' oggi ritorna {delivered:false, why:'nessuna superficie serve...'} finche' connectors/discord/ non e' cablato in cli/surface.ts — visibile, non silenzioso, ma comunque non consegnato.","evidence":"core/surface/registry.ts (SurfaceRegistry.deliver); core/scheduler/scheduler.ts:458 (settle), :491 (il suo markRan); cli/surface.ts:199 (connectSurfaces costruisce il registry da cio' che e' davvero abilitato)"}],"gaps":[{"what":"Il verdetto 'draft' del kernel dei permessi (capability a rischio medio, reversibili) e' prodotto da decide() ma SEMPRE rifiutato dal loop — il registro di undo non esiste ancora, quindi ogni capability dichiarata risk:'medium'+reversible:'undoable' e' oggi completamente non funzionante: ogni chiamata torna un errore che dice al modello di non riprovare, senza alcun percorso per riuscire mai finche' non viene costruito un registro di undo.","evidence":"agent/loop.ts:777-791 (case 'draft' -> sempre span error 'draft_unavailable'); core/policy/decide.ts:204-207 (dove 'draft' viene prodotto per decl.reversible === 'undoable')","why_it_matters":"un'intera classe di rischio che il matrix del kernel chiama 'media, reversibile' e' silenziosamente morta all'ultimo miglio — il verdetto e' dichiarato e prodotto, ma nessuno lo esegue"},{"what":"CHIUSO per testo (Deliver ora ritorna DeliveryOutcome, core/surface/types.ts) — resta aperto per allegati: SurfaceRegistry.deliverFile esiste ma nessun tool di produzione lo chiama ancora (M5-BIS B14), quindi un file scritto nel vault raggiunge l'owner solo come percorso citato nel testo, non come allegato vero.","evidence":"core/surface/types.ts (Surface.deliverFile); connectors/telegram/media.ts sendDocument scritto e testato ma senza chiamante di produzione finche' agent/tools/deliver.ts non e' cablato","why_it_matters":"un report o un grafico che il modello produce nel vault non arriva mai come file su Telegram/Discord — l'owner deve andare a leggerlo sul filesystem, il che non funziona affatto da remoto"},{"what":"ApprovalRequest non porta ne' tenant ne' principal ne' surface, e LoopDeps (l'oggetto che porta `approve`) e' condiviso per riferimento tra REPL e Telegram: cli/surface.ts costruisce TelegramConnector con `loop: runtime.deps` PRIMA che repl.ts assegni `runtime.deps.approve` — ma essendo lo stesso oggetto in memoria, l'assegnazione successiva vale anche per Telegram.","evidence":"agent/loop.ts:102-107 (ApprovalRequest: solo capability/prompt/resource); cli/repl.ts:157-164 (assegna runtime.deps.approve); cli/surface.ts:233-234 (TelegramConnector costruito con loop: runtime.deps, stesso oggetto); connectors/telegram/connector.ts:307 (runTurn(this.deps.loop, ...) usa quell'oggetto condiviso)","why_it_matters":"quando REPL e Telegram girano nello stesso processo (il modo normale documentato, ADR-0022), un 'ask' sollevato da un membro anonimo di un gruppo Telegram viene silenziosamente risposto da chi e' seduto al terminale dell'owner, e il prompt mostra solo capability e resource — mai chi ha chiesto o da dove"},{"what":"Il processo gateway (cli/gateway.ts, cmdGatewayRun) non imposta mai deps.approve in tutta la funzione — a differenza della REPL.","evidence":"cli/gateway.ts (funzione cmdGatewayRun, letta per intero: nessuna assegnazione a .approve); confronto con cli/repl.ts:157-164","why_it_matters":"sotto il gateway supervisionato — la modalita' che ADR-0035 vuole proprio per far girare i job senza una finestra aperta — ogni verdetto 'ask' su ogni superficie, Telegram incluso, e' un vicolo cieco incondizionato: il turno si ferma e dice cosa serviva, ma niente puo' mai concederlo da remoto"},{"what":"Le chiamate a runTurn dal connector Telegram non passano mai un AbortSignal, a differenza di cli/repl.ts e cli/run.ts che passano entrambe `signal: controller.signal`.","evidence":"connectors/telegram/connector.ts:307-315 (l'oggetto passato a runTurn non ha la chiave signal); cli/repl.ts:286-295 e cli/run.ts:65-72 (entrambe includono signal)","why_it_matters":"un turno innescato da Telegram non puo' mai essere cancellato una volta partito — non esiste un equivalente del Ctrl+C della REPL su quella superficie"}]},"tools":{"registry":{"file":"agent/runtime.ts:260-386 (buildRuntime, synchronous tool+capability registration); agent/runtime.ts:525-535 (attachMcp, async, called separately)","note":"buildRuntime() (agent/runtime.ts:104) builds a RegisteredTool[] array and a CapabilityId->CapabilityDecl Map at boot: fs x3 always via a single `...makeFsTools(scope)` spread (the three handlers live in agent/tools/fs.ts, not inline here), memory always, shell only if the sandbox probe succeeds, process x2 always, skill always, http always, search only if configured+keyed+allowlisted, wait and todo always (registered last, so a low maxToolsExposed profile drops them before it drops anything else), capabilities Map assembled further down. Every real entrypoint (cli/repl.ts:111, cli/run.ts:30, cli/gateway.ts:297) then calls attachMcp(runtime, home) (runtime.ts:525-535) as a second, async step that connects rot/mcp.json's servers and pushes their verified tools via Runtime.register() (runtime.ts:98,464-467 - attachMcp is its only caller, line 531). agent/loop.ts's runTool() is the sole consumer: it resolves the model-chosen name against the full deps.tools list (never the filtered 'exposed' list, so a member naming a host-only tool still gets a real policy denial and not a fabricated 'unknown tool'), derives a Resource via resourceFor() (loop.ts:1639), and gates execution through PermissionSnapshot.check() (loop.ts:747, backed by core/policy/decide.ts)."},"tools":[{"name":"fs_read","capability":"fs.read","file":"agent/tools/fs.ts:89-98","params":["path: string (required, relative to working directory)"],"risk":"low","reversible":true,"maxTaint":null,"taintOut":"tier: 2 (DISK_TIER, agent/tools/fs.ts) on every read - ADR-0044. Until that ADR this handler returned {content} with no `tier` key and a file's content was treated as fully trusted whatever its provenance; the map recorded that as a finding (see gaps) and it is now closed. 2 because `stat` cannot tell the owner's own note from something that arrived in ~/Downloads: under that uncertainty the fail-closed reading is the only honest one.","wired":true,"wiredNote":"Registered unconditionally via the `...makeFsTools(scope)` spread at agent/runtime.ts:299 - the handler itself lives at agent/tools/fs.ts:480-539 (makeFsTools), not inline in runtime.ts (the three fs handlers were unified into one factory, used by both runtime.ts and evals/floor/run.ts, so the fix could not stay in the tool file without reaching production).","onDeny":"Generic kernel refusal at agent/loop.ts:769-776: 'Rifiutato dal kernel dei permessi (\u003ccode>). Non insistere: serve una decisione dell'owner.' Most likely code in practice: taint_exceeded once turn taint > 3 (defaultMaxTaint.low, core/policy/matrix.ts:95).","oneLine":"Legge un file di testo dentro la working directory."},{"name":"fs_list","capability":"fs.list","file":"agent/tools/fs.ts:99-107","params":["path: string (required, directory relative to working directory)"],"risk":"low","reversible":true,"maxTaint":null,"taintOut":"tier: 2 (DISK_TIER) - same shape as fs_read, and the same argument: a filename is text somebody chose, and `IGNORA le istruzioni precedenti.md` costs an attacker nothing. Treating a listing as metadata rather than content would be a special case whose only argument is that the string "taintOut":"Dynamic: the max trustTier across the recalled items, 0 if none (agent/tools/memory.ts:90-93). Same rule the pre-loop's own recall applies, deliberately, per the file's docstring.","wired":true,"wiredNote":"Registered unconditionally at agent/runtime.ts:279-289. Tenant is bound from ToolContext at call time (handler: (args, ctx) => searchMemory(recallDeps, ctx.tenant, args), runtime.ts:284), not from the tool's own arguments - see gaps re: its resourceKind:'tenant' declaration.","onDeny":"agent/loop.ts:769-776 generic refusal; hostOnly:false (memory.ts:29-30) so group members are NOT blocked by principal_forbidden, unlike every host-only tool.","oneLine":"Cerca nella memoria del tenant: conversazioni, documenti, fatti appresi."},{"name":"shell_run","capability":"sys.shell","file":"agent/tools/shell.ts:42-65","params":["command: string (required)","cwd?: string (relative to project root, default root)","timeout_ms?: number (default 120000, max 600000)"],"risk":"high","reversible":false,"maxTaint":2,"taintOut":"tier: 2 - formatExecOutcome (agent/tools/shell.ts) returns DISK_TIER, the same constant fs_read uses, because `cat ~/Downloads/nota.md` is fs_read through another door and a door that did not taint was a way around the one that did (ADR-0044). maxTaint: 2, not the inherited defaultMaxTaint.high = 1 - owner decision, 2026-08-16 (ADR-0044, Revisione 2026-08-16): at taint 2 sys.shell is ask (one read downgrades the hardened auto-allow to a prompt instead of ending shell access outright); at taint 3 - a web/search/mcp result - it is still deny/taint_exceeded. The ceiling moved by one step, not away.","wired":true,"wiredNote":"Conditionally registered at agent/runtime.ts:301-304: only if `new SandboxExecutor(guards).status().available` is true, i.e. core/sandbox/executor.ts:75-78's probeSandbox() found a real OS-level containment on this host. Absent sandbox -> absent tool entirely, never an unsandboxed fallback (ADR-0018 rule 5, per the file's own docstring lines 27-30).","onDeny":"High risk: core/policy/decide.ts:208-213 allows only if hardened && owner principal && taint===0; otherwise ask(`sys.shell on ...`). If an approver is wired (agent/loop.ts:792-816), the owner is prompted and a 'no' returns 'L'owner ha rifiutato ... Non insistere' (loop.ts:806-813). If no approver is wired (see gaps), the turn stops early with stopped:'ask' and a pending ApprovalRequest (loop.ts:112-117, 577-590) instead of a normal tool_result.","oneLine":"Esegue un comando shell non interattivo, sandboxato, senza rete."},{"name":"process_list","capability":"sys.process.list","file":"agent/tools/process.ts:42-53","params":["grep?: string (case-insensitive substring filter, max 200 chars)"],"risk":"low","reversible":true,"maxTaint":1,"taintOut":"tier: 1 (ADR-0044) - the host's own process table, and `PS_ARGV` asks for `comm`, never `args`. Not DISK_TIER: choosing one of those strings costs an attacker code execution on the host, while planting a file in ~/Downloads costs them an email. Deliberately at (not above) the maxTaint:1 this capability pins, so listing processes does not become a once-per-turn tool.","wired":true,"wiredNote":"Registered unconditionally at agent/runtime.ts:310 via makeProcessTools() (both process tools come from one call).","onDeny":"agent/loop.ts:769-776 generic; realistically taint_exceeded once turn taint > 1 - a tight, explicit ceiling (process.ts:27) narrower than the low-risk default of 3, so this tool goes unreachable after a single tier-2+ event (e.g. one memory recall of group-authored content).","oneLine":"Elenca i processi in corso sull'host (pid, utente, comando)."},{"name":"process_kill","capability":"sys.process.kill","file":"agent/tools/process.ts:55-69","params":["pid: number (required, > 1)","signal?: 'TERM'|'INT'|'HUP'|'KILL' (default TERM)"],"risk":"high","reversible":false,"maxTaint":null,"taintOut":"tier: 0 on every path (ADR-0044): a kill is a write, and every string it can return - a refusal ight.js fence()), including after local main-content extraction (agent/tools/extract.ts) when the body is text/html or application/xhtml+xml. Transport/validation failures (bad URL, DNS SSRF veto, blocked redirect, fetch exception, unparseable redirect location) return `tier: 0` - explicitly since ADR-0044, where they used to carry no `tier` key and meant the same thing only by accident.","wired":true,"wiredNote":"Registered unconditionally at agent/runtime.ts:327.","onDeny":"medium+reversible:'yes' -> core/policy/decide.ts:204-207 allow (never drafts). Extra kernel logic specific to url-resourceKind capabilities: the allowlist check (off-allowlist -> ask for the owner only if taint\u003c=1, else deny/resource_denied); on an allowlisted host, a non-empty query string or fragment ALSO answers to paramsMaxTaint via gateParams (default 1, defaults/rot/policy.json) - above it, ask for the owner showing the whole URL, deny for anyone else, added by slice/egress-params (2026-08-17, P04-1) because until then the allowlist checked the host and nothing else. PLUS the tool's own re-check of every redirect hop against the same allowlist (http.ts, addressVeto/hop loop), because the kernel only ever saw hop 0's host.","oneLine":"Scarica un URL via GET, solo host in allowlist."},{"name":"web_search","capability":"sys.search","file":"agent/tools/search.ts:59-72","params":["query: string (required, max 400 chars)"],"risk":"medium","reversible":true,"maxTaint":3,"taintOut":"3 on a successful search including zero-hit responses ('nessun risultato ...'), fenced. `tier: 0` when the backend call itself throws - 'nothing from the provider reached us, so there is nothing to be tainted by', now stated rather than left unstated (ADR-0044).","wired":true,"wiredNote":"Conditionally registered at agent/runtime.ts:333-370: only if config.search is set AND the Tavily API key resolves (readSecret) AND api.tavily.com passes hostAllowed() against rot/egress.json, checked ONCE at boot - the destination is a constant, unlike http_get's model-nominated host, so there is nothing per-call for an allowlist to hold it against (search.ts:29-47). Any registration failure degrades to a boot-line note (runtime.ts:349-351, 365-368) and the tool is simply absent, not broken. Slice/egress-params (2026-08-17) closed the gap this left: the boot-time endpoint check answers 'is this destination trusted at all', not 'did this turn's taint just choose these query bytes' - see onDeny.","onDeny":"hostOnly:true (search.ts:63) so a group member is refused principal_forbidden before risk logic even runs (core/policy/decide.ts:128-130) - unlike http_get, which a member CAN reach. For the owner: resourceKind:'query' (search.ts:61, was 'none' before slice/egress-params/P04-2) reaches decide.ts's params-gate branch (gateParams, alongside http_get's own query/fragment check) - at taint \u003c= ctx.matrix.paramsMaxTaint (default 1, defaults/rot/policy.json) medium+reversible:'yes' allows same as before; above it the owner is asked and shown the query text (ApprovalRequest.resource, agent/loop.ts), never a silent allow.","oneLine":"Cerca sul web: restituisce titoli, URL e brevi estratti."},{"name":"mcp_\u003cserver>_\u003ctool>","capability":"mcp.\u003cserver>","file":"agent/tools/mcp.ts:93-114 (built per remote tool, inside buildMcpTools' loop starting at mcp.ts:61)","params":["dynamic - def.inputSchema taken verbatim from the remote MCP server's tool definition and passed through opaquely (mcp.ts:102 comment: 'the shape is the server's contract and the provider passes it through opaquely'), hash-verified against the owner's pin before being trusted"],"risk":"medium","reversible":false,"maxTaint":null,"taintOut":"3 always, on both success AND error results alike (mcp.ts:106-111: `tier: 3, ...(result.isError?{isError:true}:{})` are set unconditionally) - unlike http_get/web_search, even a remote tool's own error message taints the turn exactly like a success would.","wired":true,"wiredNote":"NOT registered inside buildRuntime()/the synchronous tools array. Registered by attachMcp() (agent/runtime.ts:525-535), a separate async function called after buildRuntime() by every real surface - cli/repl.ts:174, cli/run.ts:47, cli/gateway.ts:363 - which loads rot/mcp.json's registry, connects each server, and for each one that VERIFIES (live tool defs hash-match the owner's pin, mcp.ts:71-88) pushes its tools via Runtime.register() (runtime.ts:464-467, called at runtime.ts:531). A server whose tools don't match its pin is SUSPENDED: zero tools, zero capability, one Italian report line naming what changed (mcp.ts:74-88), and re-approval via `muffin mcp add \u003cserver>` is the only way back. Zero MCP capabilities/tools exist until rot/mcp.json lists at least one server.","onDeny":"hostOnly:true (mcp.ts:37) so a group member is refused principal_forbidden before risk logic runs. Otherwise medium+reversible:'no' -> core/policy/decide.ts:204-207 allow (never drafts, unlike fs.write). Ceiling is DELIBERATELY inherited (maxTaint omitted) rather than pinned, per mcp.ts:20-28's own warning: pinning is the fallback ONLY if the matrix's downward-clamp (core/policy/matrix.ts `tighter()`) is ever removed.","oneLine":"Chiama un tool di un server MCP remoto, verificato."}],"capabilities":[{"id":"fs.read","risk":"low","reversible":true,"maxTaint":null,"file":"agent/tools/fs.ts:62-69","hasTool":true,"note":"1:1 with fs_read. No maxTaint declared -> inherits defaultMaxTaint.low = 3 (core/policy/matrix.ts:95), deliberately not pinned so an owner who lowers policy.json's low ceiling is obeyed (fs.ts:88-124 argues this at length: the alternative would break search-then-read-notes in one turn)."},{"id":"fs.list","risk":"low","reversible":true,"maxTaint":null,"file":"agent/tools/fs.ts:70-77","hasTool":true,"note":"1:1 with fs_list. Same inherited ceiling as fs.read."},{"id":"fs.write","risk":"medium","reversible":null,"maxTaint":null,"file":"agent/tools/fs.ts:78-85","hasTool":true,"note":"1:1 with fs_write - but see gaps. reversible:'undoable' routes every call to the kernel's 'draft' verdict (core/policy/decide.ts:204-207), and agent/loop.ts always hard-refuses 'draft' because no undo journal exists (loop.ts:777-791). The capability, the tool and the registration all exist and are reachable; only the write itself never happens, for anyone, at any taint."},{"id":"memory.read","risk":"low","reversible":true,"maxTaint":null,"file":"agent/tools/memory.ts:21-30","hasTool":true,"note":"1:1 with memory_search. Declares resourceKind:'tenant' + policyArgs:['query'] (memory.ts:25-26), but see gaps: agent/loop.ts's resourceFor() (loop.ts:1639) only ever constructs 'url' or 'path' resources, never 'tenant' - this declaration never reaches decide() as a real Resource. Tenant scoping is real but happens structurally instead, via ToolContext.tenant threaded straight to the handler (loop.ts, toolContext construction; memory.ts:48-52)."},{"id":"sys.process.list","risk":"low","reversible":true,"maxTaint":1,"file":"agent/tools/process.ts:23-31","hasTool":true,"note":"1:1 with process_list. Ceiling explicitly pinned to 1, narrower than the low-risk default of 3 - process.ts:18-20 states why: 'the matrix row for host processes denies everything at taint >=2, so the list capability narrows its ceiling explicitly.'"},{"id":"sys.process.kill","risk":"high","reversible":false,"maxTaint":null,"file":"agent/tools/process.ts:32-39","hasTool":true,"note":"1:1 with process_kill. No maxTaint declared, but high's default ceiling is already 1 (matrix.ts:95), so nothing would change by pinning it."},{"id":"sys.shell","risk":"high","reversible":false,"maxTaint":null,"file":"agent/tools/shell.ts:32-40","hasTool":true,"note":"1:1 with shell_run, but the tool is registered only when the sandbox probe succeeds (agent/runtime.ts:301-304) - an install without a working sandbox has a declared capability with no tool behind it at all."},{"id":"sys.http","risk":"medium","reversible":true,"maxTaint":3,"file":"agent/tools/http.ts:30-39","hasTool":true,"note":"1:1 with http_get. Ceiling explicitly widened to 3 above the medium default of 1, reasoned about at length in decide.ts:32-43 (a tainted turn may still read another public page)."},{"id":"sys.search","risk":"medium","reversible":true,"maxTaint":3,"file":"agent/tools/search.ts:48-57","hasTool":true,"note":"1:1 with web_search, but the tool is registered only when config.search + a resolvable API key + an egress-allowlisted endpoint all hold (agent/runtime.ts:333-370) - otherwise the capability is simply never added to the map at all (runtime.ts:384: '...(searchOn ? [searchCapability] : [])'), so this is one of the few capability declarations that is itself conditional, not just its tool."},{"id":"skill.read","risk":"low","reversible":true,"maxTaint":1,"file":"agent/tools/skill.ts:22-30","hasTool":true,"note":"1:1 with skill_read. Ceiling pinned to 1 - narrower than low's default of 3 - specifically so a tainted turn cannot read a skill body and then combine it with the hardened-mode shell auto-allow (see skill_read's taintOut for the historical near-miss this closed)."},{"id":"mcp.\u003cserver>","risk":"medium","reversible":false,"maxTaint":null,"file":"agent/tools/mcp.ts:30-39 (mcpCapabilityFor - a template function, not a static constant)","hasTool":true,"note":"One instance PER connected+hash-verified MCP server, not a single static id - created by mcpCapabilityFor(server) inside buildMcpTools' loop (mcp.ts:91) and registered late via attachMcp()/Runtime.register(), never inside buildRuntime() itself. Zero instances exist until rot/mcp.json lists a server; a server whose live tool defs don't hash-match its pin gets zero tools AND zero capability ('SOSPESO', mcp.ts:74-88). maxTaint is deliberately left undeclared (inherits medium's default of 1) - mcp.ts:20-28 warns this must stay inherited, not pinned, unless core/policy/matrix.ts's downward-only clamp on policy.json is ever removed; a judge run once measured that exact clamp's absence turning this into a silent allow at taint 3."}],"gaps":[{"what":"fs_write is fully registered, declared, schema-valid and reachable by the model - and can never actually write a file. fs.write is declared risk:'medium' + reversible:'undoable' (agent/tools/fs.ts:78-85). core/policy/decide.ts:204-207 maps EVERY medium+undoable capability to effect:'draft'. agent/loop.ts:777-791 has no undo journal implemented, so the 'draft' case is an unconditional hard refusal (isError:true, 'il registro di undo non esiste ancora') - the fsWrite() function itself (fs.ts:257-262) is fully correct code with no caller in production.","evidence":"agent/tools/fs.ts:78-85; core/policy/decide.ts:204-207; agent/loop.ts:777-791; confirmed by tests at core/policy/decide.test.ts:117 (draft even for owner at taint 0) and agent/loop.test.ts:527-556 ('refuses a draft instead of executing it as an allow')","why_it_matters":"The only declared write capability among 'the three filesystem primitives of M1' (fs.ts:7) is inert in every build that ships today - an owner asking Muffin to save a note or edit a file gets the same fixed Italian refusal every single time, and no runtime configuration changes that outcome; only building the undo journal would."},{"what":"The owner-approval channel (LoopDeps.approve) is implemented on exactly one of the three real surfaces. cli/repl.ts:157-164 sets runtime.deps.approve (reads a yes/no from the terminal's stdin). cli/gateway.ts - the headless daemon that hosts the Telegram connector via cli/surface.ts:295 (connectSurfaces, called identically by both repl.ts and gateway.ts, and now also the source of both the turn lane's delivery door and the scheduler's SurfaceRegistry) - never sets it anywhere in the file. cli/surface.ts:344 builds TelegramConnector with `loop: runtime.deps` as-is, no override.","evidence":"agent/loop.ts:172 (Approver is optional on LoopDeps); agent/loop.ts:798-803 (no approver -> throw ApprovalRequired, turning into stopped:'ask' at loop.ts:577-590 with the text 'Su questa superficie non posso chiederla.'); cli/repl.ts:157-164 (the only .approve assignment found in cli/ or agent/, via grep); cli/gateway.ts (zero occurrences of 'approve'); connectors/telegram/connector.ts:307-317 (runs the turn, forwards only result.text to the chat, never reads result.pending)","why_it_matters":"cli/run.ts:96-113 treats a missing approval channel as a deliberate, documented design for a one-shot script ('Headless has no channel by design', exits 3 and tells the operator to relaunch interactively) - but cli/gateway.ts is not a script, it is the always-on daemon meant to host Telegram for ongoing use. On that surface sys.shell and sys.process.kill are permanently un-approvable for the owner too, not just group members: there is no code path today that can turn their 'ask' verdict into an 'allow' outside a foreground `muffin` terminal session, and the turn only ever reports this politely in the chat rather than at boot."},{"what":"CLOSED by ADR-0044 (2026-08-15). WAS: five of the ten static tool handlers never set ToolOutcome.tier at all - fs_read, fs_list, shell_run (formatExecOutcome), process_list and process_kill all returned a plain {content}, and agent/loop.ts raised taint only when outcome.tier was present, so none of the five could ever raise the turn's taint. NOW: `tier` is a REQUIRED field on ToolOutcome, so the omission is a compile error rather than a silent zero, and the loop raises unconditionally. fs_read/fs_list/shell_run carry DISK_TIER = 2, process_list carries 1, process_kill and the pure-error paths carry an explicit 0.","evidence":"docs/blueprint/adr/0044-il-disco-non-ha-provenienza.md; agent/loop.ts (`tier: TrustTier` required, `snapshot.raiseTaint(outcome.tier)` unconditional); agent/tools/fs.ts (DISK_TIER, makeFsTools); agent/read-then-egress.test.ts (the chain, measured red first); agent/runtime-wiring.test.ts (the same chain through buildRuntime)","why_it_matters":"This map found it and could not tell whether it was a decision or an omission - and it was worse than either: fs.ts's own long comment argued its high taint ceiling by leaning on the egress gate ('off-allowlist above taint 1 is DENY, never ask'), and that gate reads the turn's taint, which the read did not raise. The security argument written in the file depended on a property the file did not produce. Measured before the fix: fs_read of an injected file, then http_get to an off-allowlist host, came back as an `ask` the owner approved and the fetch ran. The cost of the fix is stated and deliberate: a turn that has read from disk can no longer act on the host (shell, skill_read, process, mcp all become taint_exceeded), which is threat model 03 section 3's own row applied to a context that swallowed unprovenanced bytes."},{"what":"memory.read declares resourceKind:'tenant' and policyArgs:['query'] (agent/tools/memory.ts:25-26), and the Resource type has a matching {kind:'tenant', value: TenantId} variant (core/policy/types.ts:40-44) - but agent/loop.ts's resourceFor(), the only function that turns a capability declaration plus call args into a kernel-facing Resource, exclusively special-cases 'url' and 'path' and returns {kind:'none'} for anything else (agent/loop.ts:2110-2123: `resourceFor` special-cases only 'url' and 'path' at :2114 and returns {kind:'none'} at :2115 and :2123). No 'tenant' Resource is ever constructed by any code path read in this repo.","evidence":"agent/tools/memory.ts:25-26; core/policy/types.ts:40-44; agent/loop.ts:1887 (`if (!decl || (decl.resourceKind !== 'url' && decl.resourceKind !== 'path')) return {kind:'none'}`)","why_it_matters":"Reading the declaration alone, it looks like the kernel checks the tenant resource per call the way it checks 'url' against the egress allowlist (decide.ts:155-193) - it does not; core/policy/decide.ts has no branch on resource.kind==='tenant' at all. Real tenant scoping for memory_search does hold, but entirely outside decide(), via ToolContext.tenant threaded straight into the handler (loop.ts, toolContext construction; memory.ts:48-52) - which is safe today only because that wiring is correct, not because the declared resourceKind is doing any enforcement."}]},"policy":{"kernel":{"fn":"decide","file":"core/policy/decide.ts:92","pure":true,"inputs":[{"name":"principal","type":"Principal","note":"owner|member|system|agent — types.ts:11-24; never inferred from message content"},{"name":"tenant","type":"TenantId","note":"types.ts:27; checked for coherence against principal at decide.ts:120-123"},{"name":"capability","type":"CapabilityId","note":"dotted id; undeclared = deny (decide.ts:96-98)"},{"name":"resource","type":"Resource","note":"path|url|tenant|none — types.ts:40-44; url resources are the only ones gated against the egress allowlist"},{"name":"args","type":"Readonly\u003cRecord\u003cstring,unknown>>","note":"types.ts:67 'already validated against the tool's input schema — never raw model output'"},{"name":"taint","type":"TrustTier (0-3)","note":"types.ts:69-70 'Recomputed at every call, never frozen for the turn'"},{"name":"ctx.capabilities","type":"ReadonlyMap\u003cCapabilityId,CapabilityDecl>","note":"boot-time closure input, decide.ts:20"},{"name":"ctx.matrix","type":"PolicyMatrix","note":"boot-time closure input from rot/policy.json, decide.ts:45; POLICY_FLOOR is the compiled fallback (matrix.ts:94-102)"},{"name":"ctx.budgetExhausted","type":"(tenant:string)=>boolean","note":"boot-time closure, decide.ts:55; sync so the kernel stays sync"},{"name":"ctx.hardened","type":"boolean","note":"decide.ts:60; gates whether a high-risk owner call can silently allow"},{"name":"ctx.safeMode","type":"boolean|undefined","note":"decide.ts:67; RoT-diverged flag, checked first of all"},{"name":"ctx.egressAllowed","type":"(host:string)=>boolean|undefined","note":"decide.ts:74; ABSENT means deny-all, not allow-all"}],"effects":[{"effect":"allow","meaning":"capability executes immediately, no confirmation or journal","whoConsumes":"agent/loop.ts:817-824 (case 'allow': break, falls into tool.handler at line 823)"},{"effect":"ask","meaning":"owner is prompted synchronously; on a surface with no approver the turn stops and reports what it wanted instead of executing","whoConsumes":"agent/loop.ts:792-816 (calls deps.approve, or throws ApprovalRequired which runTurn turns into stopped:'ask')"},{"effect":"draft","meaning":"threat-model spec is act-notify-undo: execute now, reversibly, tell the owner, keep an undo window (decide.ts:206 windowSeconds:300)","whoConsumes":"NOBODY executes the drafted action. agent/loop.ts:777-791 intercepts every 'draft' verdict and returns a hard refusal (isError, 'draft_unavailable') because no undo journal exists yet — the kernel's own comment at decide.ts:205-207 and the loop's comment both say so. The only capability that can ever produce 'draft' is fs.write (agent/tools/fs.ts:79-85, the sole risk:'medium'+reversible:'undoable' declaration), so fs_write cannot succeed under any principal/taint/hardened combination today — confirmed by core/policy/decide.test.ts:117."},{"effect":"deny","meaning":"refused with a machine-readable DenyCode and free-text detail, logged","whoConsumes":"agent/loop.ts:769-776 (isError tool_result carrying decision.code)"}]},"decisionOrder":[{"n":1,"rule":"capability must be declared (registered by some tool)","file":"core/policy/decide.ts:95-98","outcome":"deny no_capability"},{"n":2,"rule":"safeMode true AND risk !== 'low'","file":"core/policy/decide.ts:103-109","outcome":"deny safe_mode — checked before anything that could allow, on purpose"},{"n":3,"rule":"capability covered by matrix.neverAtRuntime (rot.write, rot.*)","file":"core/policy/decide.ts:111-117","outcome":"deny rot_violation"},{"n":4,"rule":"tenant on the request must equal tenantOf(principal)","file":"core/policy/decide.ts:119-123","outcome":"deny tenant_mismatch"},{"n":5,"rule":"capability.hostOnly AND principal.kind === 'member'","file":"core/policy/decide.ts:127-130","outcome":"deny principal_forbidden"},{"n":6,"rule":"principal.kind === 'system' AND capability covered by matrix.forbiddenForSystem (outward.*, config.ratchet)","file":"core/policy/decide.ts:132-134","outcome":"deny principal_forbidden — NOTE: does not check principal.kind==='agent', only 'system'"},{"n":7,"rule":"taint > ceiling, where ceiling = decl.maxTaint ?? matrix.defaultMaxTaint[decl.risk]","file":"core/policy/decide.ts:136-143","outcome":"deny taint_exceeded"},{"n":8,"rule":"decl.risk !== 'low' AND budgetExhausted(tenant)","file":"core/policy/decide.ts:145-147","outcome":"deny budget_exhausted"},{"n":9,"rule":"resourceKind === 'url': resource must actually be kind:'url' (else refuse rather than skip), host must parse, host checked against egress allowlist; off-list → ask if owner+taint\u003c=1, else deny","file":"core/policy/decide.ts:149-193","outcome":"deny resource_denied OR ask(owner prompt) OR pass through"},{"n":10,"rule":"principal.kind is 'system' or 'agent' AND decl.risk === 'high'","file":"core/policy/decide.ts:195-199","outcome":"ask 'queued: \u003ccapability> requested by \u003ckind>' — autonomous principals never auto-approve high risk"},{"n":11,"rule":"final switch on decl.risk","file":"core/policy/decide.ts:201-214","outcome":"low -> allow; medium+undoable -> draft, medium+other -> allow; high -> allow only if hardened && owner && taint===0, else ask"}],"taint":{"tiers":[{"tier":0,"name":"owner","sources":["agent/loop.ts:449 (a fresh turn's record is written with taint 0 for a non-member principal)","docs/blueprint/03-threat-model.md:21"],"meaning":"direct owner-authenticated content before any higher-tier block enters context; system/agent remain distinct principals even when the loop initializes their taint at 0"},{"tier":1,"name":"contatti confermati (confirmed contacts)","sources":["docs/blueprint/03-threat-model.md:21 (declared only)"],"meaning":"not sourced to a concrete assignment site within core/policy|rot|vault|sandbox|net|budget|session|tracing — likely assigned in core/memory/recall.ts or a connector, which were out of this scan's scope"},{"tier":2,"name":"gruppo/sconosciuti (group members) — e il disco","sources":["agent/loop.ts (principal.kind === 'member' ? 2 : 0, written into the record's taint column)","agent/tools/fs.ts (DISK_TIER, ADR-0044)"],"meaning":"turn started by a non-owner group member, OR a turn that read from the local filesystem: `stat` cannot separate the owner's own note from a file a stranger sent, so an unprovenanced read lands in the same bucket as a stranger speaking"},{"tier":3,"name":"web/tool-esterni","sources":["agent/tools/http.ts (ToolOutcome.tier: 3 on every sys.http result)"],"meaning":"any tool result whose content came from outside the house; raises the running turn taint via snapshot.raiseTaint, which since ADR-0044 is called unconditionally because `tier` is a required field"}],"monotonic":"agent/loop.ts:942-946 — raiseTaint(tier) only assigns when tier > taint, and clears the per-turn decision cache on every raise; there is no lowerTaint anywhere in the codebase (grep confirms). types.ts:104-109 documents the PermissionSnapshot contract this implements.","maxTaintDefaults":"core/policy/matrix.ts:94-102 (POLICY_FLOOR.defaultMaxTaint = { low: 3, medium: 1, high: 1 }), mirrored verbatim in the shipped seal at defaults/rot/policy.json:4. A sealed rot/policy.json may only tighten these (core/policy/matrix.ts:162-165 tighter(), 181-185 merge()) — never raise them, even if the file says so."},"denyPaths":[{"pattern":"~/.muffin/rot/ (p.rot)","file":"core/rot/guards.ts:69","enforced":true,"note":"enforced in agent/tools/fs.ts:315-345 (resolveInScope) and core/sandbox/executor.ts:118-120,139 (filesystem.denyWrite, both base and per-call config)"},{"pattern":"config (p.config)","file":"core/rot/guards.ts:71","enforced":true,"note":"same two enforcement sites as above"},{"pattern":"secrets — both ADR-0039 links: secretDir('home'), secretDir('persistent')","file":"core/rot/guards.ts:73-74","enforced":true,"note":"in BOTH denyWrite and denyRead (guards.ts:82-83); also fed into SandboxExecutor.denyRead"},{"pattern":".git/hooks (join(cwd,'.git','hooks'))","file":"core/rot/guards.ts:76","enforced":true,"note":"previously missing from the runtime's deny list per the file's own history comment (guards.ts:9-23); now enforced at both sites"},{"pattern":"shell dotfiles — 9 named files (.zshrc/.zshenv/.zprofile/.zlogin/.bashrc/.bash_profile/.bash_login/.profile/.kshrc) + fish config","file":"core/rot/guards.ts:47-57,77-79","enforced":true,"note":"named individually rather than globbed, by design (guards.ts:41-46)"}],"denyPathsSummary":"5 of 5 mandatory categories from docs/blueprint/03-threat-model.md:69 are declared in core/rot/guards.ts and all 5 are enforced at both consumers (agent/tools/fs.ts fs_write path resolution, core/sandbox/executor.ts sandbox filesystem config) via the single shared mandatoryGuards() object passed to both from agent/runtime.ts:258-259,301. Tested directly: core/rot/guards.test.ts:38-61 ('the five mandatory deny paths ... names all five, so a category cannot be dropped silently') and :63-86 ('the deny paths beat an allow-write that contains them').","surfaces":[{"name":"RoT / sigillo","file":"core/rot/verify.ts:156-213 (verify), core/rot/verify.ts:120-178 (hardeningHolds), core/rot/readers.ts:261-354 (checkRotReaders)","guards":"hash-chain (manifest.json + external anchor) over every file under rot/; two modes — hardened (refuse boot on divergence) vs single-user (degrade to safe mode); a second, independent invariant that every sealed file has a real production reader","holds":"hardened is no longer a config self-report — hardeningHolds() probes W_OK on the RoT dir, the anchor, the manifest and every sealed file, AND (P36, since a same-uid file is one same-user chmod away from writable regardless of current mode) that the owning uid differs from this process's own and no group/other write bit is set (verify.ts:120-178), wired at agent/runtime.ts:135-146 so a falsely-hardened install degrades to single-user semantics and tells the owner why. checkRotReaders (readers.ts) strips comments and imports before matching, specifically because a prior version was fooled by a docstring naming a file with no code opening it (readers.ts:204-222).","gap":"forbiddenForSystem (matrix.ts:99: outward.send/outward.*/config.ratchet) is checked only for principal.kind==='system' (decide.ts:132), never for 'agent' — this matches the threat-model's literal wording ('escluse... da system@scheduler', 03-threat-model.md:53) but is a narrower guarantee than a reader might assume; currently moot only because no outward.* capability is registered yet (grep confirms zero declarations)."},{"name":"Vault","file":"core/vault/vault.ts:95-338","guards":"content-hash identity (hashOf, sha256) decides changed-vs-unchanged, not mtime; trust tier is inherited from the existing indexed row or from any other path with identical content, never lowered by a rename; a fixed filename/dotfile denylist keeps certain files from ever becoming indexed content, checked on the symlink-resolved real path","holds":"vault.ts:219-227 — tier = existing-row-tier ?? maxTierForContent(hash) ?? caller default, so a tier-3 file renamed or copied cannot launder down to whatever tier the next reindex call defaults to; skipReason (vault.ts:58-67) runs on realpathSync'd segments specifically so a symlink named 'appunti' pointing at ~/.ssh cannot dodge the filter by its display name; audit() (core/vault/vault.ts:420-337) independently cross-checks disk vs index and reports missing/stale/orphaned rather than trusting the incremental updater's own bookkeeping.","gap":"NEVER_CONTENT (core/vault/vault.ts:74-77) is a fixed 9-name list (id_rsa, id_ed25519, id_ecdsa, credentials, credentials.json, secrets.json, service-account.json, keyfile.json, authorized_keys) — filename-based only. A credential pasted into an ordinarily-named note (e.g. notes.md) is chunked, embedded and made recallable into any future prompt; the vault pipeline never reuses core/tracing/redact.ts's value-shape secret net, and vault.ts:26-30 explicitly documents that documents are 'never mined for facts' — but that design goal is about belief-extraction, not about secret-shaped strings reaching the embedder."},{"name":"Sandbox","file":"core/sandbox/executor.ts:63-239, core/sandbox/probe.ts:31-179","guards":"platform-native OS sandbox (Seatbelt on macOS, bubblewrap on Linux), gated behind a probe that executes a REAL containment rather than checking for a binary; filesystem write-scope + mandatory RoT deny paths on every call; network allow-only per invocation with an empty default; rebuilt (not inherited) child environment","holds":"probe.ts:61-127 (macOS) runs a deny-all profile that must fail a read of /etc/hosts, THEN an allow-all control that must succeed — so a broken sandbox-exec binary cannot be misread as containment (the exact bug class documented at probe.ts:99-106, dated 2026-08-15 against macOS 15's exit-65 behavior); probe.ts:129-169 (Linux) runs a real bwrap --unshare-all and explicitly refuses to answer when run as root (probe.ts:130-140) because root bypasses the userns restriction and would report a false positive. executor.ts:168-178 rebuilds the child env from a 5-key allowlist plus whatever srt itself changed, so a provider API key sitting in the host's own env never rides into the sandboxed child. All of the above have executing tests, not just assertions on config shape (core/sandbox/executor.test.ts: 'a write inside the scope succeeds', 'network egress is denied by default', 'a host-env secret does not ride into the child environment').","gap":"PLATFORM SPLIT — macOS: Unix-domain-socket restriction stays on by default (no override); Linux: both baseConfig() and every per-call config set `allowAllUnixSockets: true` (executor.ts:114-115, 134) because the optional seccomp layer is off in v1 (two open upstream bugs on Ubuntu 24.04, executor.ts:112-114) — declared in the source, not silent, but it means Linux installs have a containment layer macOS installs do not need to give up. SEPARATE, LARGER GAP on both platforms: filesystem READ is not scoped at all beyond the RoT's 2-3 explicit denyRead paths (core/rot/guards.ts:81-87) — confirmed by the test's own title, core/sandbox/executor.test.ts:173 'the write scope is a write scope — reads outside it are NOT contained (declared limit)'. An approved sys.shell command (ask-gated, high risk) can read any host file the OS user running Muffin can read — e.g. ~/.ssh/id_rsa is not on any deny-read list — and return it as tool output."},{"name":"Egress / allowlist","file":"core/net/egress.ts:41-124; kernel check at core/policy/decide.ts:149-193","guards":"allow-only hostname allowlist (exact match or single-label wildcard) evaluated by the kernel for any capability declared resourceKind:'url'; an SSRF floor (isForbiddenAddress) blocking loopback/RFC1918/link-local(incl. cloud metadata)/CGNAT/multicast/reserved and their IPv6 equivalents including v4-mapped-v6, applied by the http tool per-hop after DNS resolution","holds":"ships with an empty allow list by default (defaults/rot/egress.json:4 — 'No domain is granted by default'); off-allowlist is ASK only for the owner at taint\u003c=1 and DENY for every other principal/taint combination (decide.ts:182-192) — a tainted context cannot nominate a new exfiltration destination, per decide.ts:149-154's own reasoning comment; agent/tools/http.ts:116-122 re-checks EVERY redirect hop against the same allowlist, not just the URL the kernel approved, closing the '302 as allowlist bypass' path; isForbiddenAddress is actually called (agent/tools/http.ts:192,203), not merely declared.","gap":"sys.shell and sys.process.* declare resourceKind:'none' (agent/tools/shell.ts:36, agent/tools/process.ts:28,37) so they never reach the kernel's egress branch at all — their only network control is the sandbox's per-call allowedDomains, which agent/tools/shell.ts:106-111 never populates (no allowHosts field passed), so shell network access is fully blocked rather than allowlisted — stricter than 'allowlist', worth noting as a mechanism difference. Separately, agent/tools/http.ts:22-24 self-declares a resolve-then-connect DNS-rebinding TOCTOU window as an accepted v1 limit."},{"name":"Budget","file":"core/budget/budget.ts:66-152, core/budget/pricing.ts:45-89, sealed loader core/rot/budgets.ts:104-149","guards":"two independent caps — global monthly, per-tenant-per-day — read once from the sealed rot/budgets.json; the kernel refuses any non-low-risk capability once budgetExhausted(tenant) is true (decide.ts:145-147); pricing turns raw token counts into USD so exhausted() has a real number to compare","holds":"the host tenant is deliberately exempt from the daily cap (budget.ts:127-130, documented rationale: the cap exists to stop a group talking to itself, not to throttle the owner's own day) while still bound by the global monthly cap; recordSpend is called on every model response in the loop (agent/loop.ts:453-461) and its result invalidates the cached permission snapshot (agent/loop.ts:466) so a decision cached before the cap tripped cannot outlive the crossing; unknown/unrecognised models are priced at the highest known rate (pricing.ts:43,52 UNKNOWN={15,75}) so an unrecognised model trips the cap early rather than never.","gap":"core/budget/pricing.ts:74-88's own comment: on the native Anthropic adapter, cache-write tokens are undercounted — billed at a fraction of the input rate against a true higher cost, because on that adapter `inputTokens` excludes written tokens (true only on the OpenRouter-compat wire). The file's stated safety invariant ('being wrong here is not dangerous ... an unknown model is charged at the highest known rate') is inverted on this one code path; the comment says the fix is filed, not smuggled in — i.e. still open."},{"name":"Tracing / redaction","file":"core/tracing/redact.ts:1-95, core/tracing/tracer.ts:24-104","guards":"two independent filters applied to every span's attributes at end(): a field-NAME filter that segments camelCase/snake_case/kebab-case into words and matches 11 whole secret-words (key, token, secret, password, passwd, credential, credentials, auth, bearer, cookie, session), and a value-SHAPE filter matching 7 known credential regexes (OpenAI/Anthropic/GitHub/Slack/Google key formats, JWT, PEM)","holds":"redaction is invoked unconditionally inside SpanHandle.end() (tracer.ts:94: `attributes: redactAttributes(current)`), so no caller can forget to redact a span; the word-splitter fixes a real, shipped hole documented in the file's own header — the previous delimiter-based regex caught `api_key` but not `apiKey`/`authToken`/`accessToken`/`clientSecret` for the module's entire life with zero tests (redact.ts:11-24), now covered by redact.test.ts.","gap":"CLOSED (ADR-0048, 2026-08-17, P34-2): redactText is now also called from agent/loop.ts's runTool — agent/loop.ts:2004 (success path, before recordOutcome/sessions.append/the returned tool_result) and agent/loop.ts:2044 (the catch path's error message) — so core/session/store.ts's `append` and core/turns/store.ts's `endToolCall`/`finish` receive already-redacted content, not raw. Verified by reading both sinks: neither transforms content again, so redacting once upstream is sufficient (agent/secret-redaction.test.ts reads the actual SQLite row and the actual JSONL line, not the in-memory value; mutation-verified: removing either redactText call turns the durable-record assertions red). redact.ts itself gained a secret-reference passthrough (`secret://\u003cname>`, redact.ts:90, never redacted even under a secret-flavoured field name) and three labelled shapes — Bearer header, key=value/JSON pairs, Telegram bot token (redact.ts:110-121) — measured against a 15-item false-positive corpus (redact.test.ts), zero hits. Declared residual, not closed by this change: this whole mechanism is class-3, best-effort text matching on content that merely *looks* like a secret — it is not the guarantee for a secret the backend actually knows. That guarantee is structural and separate: readSecret (core/config/config.ts) has a fixed, enumerated set of callers (core/config/secret-boundary.test.ts), none of which is a tool handler, so a real secret never reaches this redaction path in the first place. `muffin init --api-key` remains a declared, unfixed gap: the key is visible in argv/`ps aux`/shell history at that one entry point (ADR-0048 §Cosa NON copre)."},{"name":"Session transcripts (supplementary — not in the required 6, added because core/session/ was in scope and is load-bearing for the redaction gap above)","file":"core/session/store.ts:35-69","guards":"append-only per-session JSONL, one file per session id, tolerant of a truncated last line (crash mid-write loses only the partial record)","holds":"SessionMessage has no tenant field at all (store.ts:21-31); isolation between tenants is achieved entirely by callers choosing non-colliding, tenant-derived session ids — confirmed by reading every call site: connectors/telegram/connector.ts:313 uses `telegram:${chatId}`, agent/scheduler-run.ts:44 uses `job-${job.id}-...`, agent/observe-run.ts:53 uses `observe-${entityId}-...`, cli/run.ts:54-55 defaults to a random id. No collision found in the call sites read.","gap":"the store itself enforces no tenant isolation — nothing in core/session/store.ts would catch two different tenants being handed the same session id by a future caller bug; the guarantee is entirely a convention upheld outside this module."}],"claimedVsReal":[{"claim":"DRAFT (act-notify-undo)","doc":"docs/blueprint/03-threat-model.md:30","real":"kernel emits 'draft' for fs.write unconditionally; the loop refuses every draft outright — no act, no notify, no undo journal exists","verdict":"BROKEN","evidence":"core/policy/decide.ts:204-207; agent/loop.ts:777-791; core/policy/decide.test.ts:117"},{"claim":"Shell / filesystem host / processi ... taint 2 -> ASK (shell; emendamento owner 2026-08-15/16, ADR-0044 §revisione) · taint 3 -> DENY. The row label still spans three capability families; the amended cell, its note (docs/blueprint/03-threat-model.md:51) and ADR-0044 §Revisione name only sys.shell ('tocca solo il soffitto di sys.shell ... non quella che legge').","doc":"docs/blueprint/03-threat-model.md:45; docs/blueprint/adr/0044-il-disco-non-ha-provenienza.md:180","real":"Measured 2026-08-16 by running createDecide() with the production declarations against the shipped matrix (defaults/rot/policy.json:4 == POLICY_FLOOR core/policy/matrix.ts:95: low 3 / medium 1 / high 1). sys.shell: maxTaint pinned to 2 (agent/tools/shell.ts:53) so taint 2 passes the ceiling check (core/policy/decide.ts:136-143) and lands in the high branch, which is ask unless hardened && owner && taint===0 (core/policy/decide.ts:208-213) — ASK for the owner, queued-ASK for system/agent (core/policy/decide.ts:197-199); taint 3 is deny/taint_exceeded. The shell half of the row now HOLDS. fs.read and fs.list: risk low, no maxTaint (agent/tools/fs.ts:105-121) -> ceiling 3 -> ALLOW at taint 2 AND 3, contradicting both cells — deliberate (ADR-0039; agent/tools/fs.ts:69-80: the read itself pays by tainting the turn to DISK_TIER=2, agent/tools/fs.ts:65). fs.write: medium, no maxTaint (agent/tools/fs.ts:123-124) -> ceiling 1 -> deny/taint_exceeded at 2 and 3, stricter than the row's ASK. sys.process.list pins maxTaint 1 (agent/tools/process.ts:24-28) and sys.process.kill is high with no maxTaint (agent/tools/process.ts:34-35) -> both deny/taint_exceeded at 2 and 3, stricter than ASK. All six are hostOnly, so a member@group principal gets deny/principal_forbidden before taint is read (core/policy/decide.ts:128-130): for groups the 'qualunque' column is DENY whatever the cell says. Net: one  parte (rewritten 2026-08-17 per ADR-0048; superseded the narrower 'mai in chiaro nei trace' this row used to check)","doc":"docs/blueprint/03-threat-model.md:121; docs/blueprint/adr/0048-segreti-mai-mostrabili.md","real":"two distinct mechanisms, not one. (1) Structural, for a secret the backend actually knows: readSecret has a fixed, enumerated set of production callers (agent/runtime.ts, cli/surface.ts, cli/doctor.ts), none a tool handler, each resolving inline into the privileged sink that needs it and never storing the plaintext elsewhere — enumerated by a test that walks the whole source tree, not asserted. (2) Best-effort text redaction, for content that merely looks like a secret (a tool result, a thrown error): applied once, upstream, in agent/loop.ts's runTool, before the durable record, the session JSONL and turns.messages — verified by reading the actual DB row and the actual JSONL line, and by mutation. The session-transcript gap this row used to name (core/session/store.ts writing verbatim with no redaction anywhere upstream) is closed by (2). One declared residual: `muffin init --api-key` puts a fresh key in argv (ps aux, shell history) at the one entry point that still can — not fixed by this change, named in ADR-0048.","verdict":"HOLDS","evidence":"core/config/secret-boundary.test.ts; agent/loop.ts:2004,2044; core/tracing/redact.ts:90,110-121; agent/secret-redaction.test.ts; evals/acceptance/scenarios/e-cost.accept.ts (scenario E3); core/rot/guards.test.ts"},{"claim":"Sandbox non disponibile != silenziosamente unsandboxed","doc":"docs/blueprint/03-threat-model.md:70","real":"when the probe fails, the shell tool is simply never registered (absent from the tool list) rather than the documented ALLOW-to-ASK step-down — stricter in outcome, different in mechanism","verdict":"PARTIAL","evidence":"agent/runtime.ts:301-304"},{"claim":"outward.* escluse del tutto da system@scheduler a qualunque taint","doc":"docs/blueprint/03-threat-model.md:53","real":"forbiddenForSystem is checked only for principal.kind==='system', exactly as worded (not for 'agent'); matches literally, currently unexercised since no outward.* capability is registered","verdict":"HOLDS","evidence":"core/policy/decide.ts:132-134; core/policy/matrix.ts:99"},{"claim":"an unknown model is charged at the highest known rate","doc":"core/budget/pricing.ts:17-18 (internal safety claim, not the threat model doc)","real":"true for unrecognised model ids, but cache-write tokens are undercounted on the native Anthropic adapter by the file's own admission — the opposite direction from the stated safety rule","verdict":"PARTIAL","evidence":"core/budget/pricing.ts:74-88"}],"gaps":[{"what":"fs.write is permanently non-executable: the only capability declared reversible:'undoable' always produces 'draft', and the loop always refuses 'draft' because no undo journal exists","evidence":"agent/tools/fs.ts:79-85; core/policy/decide.ts:204-207; agent/loop.ts:777-791; core/policy/decide.test.ts:117","why_it_matters":"the agent's only file-write tool cannot succeed under any principal, taint, or hardened combination today — a whole verdict of the four-verdict kernel (allow/ask/draft/deny) has zero live executions in production."},{"what":"sandboxed shell execution has no read containment beyond 2-3 explicit RoT paths","evidence":"core/rot/guards.ts:81-87; core/sandbox/executor.ts:117-118,136-137; core/sandbox/executor.test.ts:173","why_it_matters":"once sys.shell is approved (ask-gated, high risk), the command can read any file the host OS user can read — e.g. ~/.ssh — not just the workspace, and that output flows straight back into the model's context."},{"what":"session transcripts bypass the redaction layer entirely","evidence":"core/session/store.ts:48-50 (no redact call in the whole module); core/tracing/tracer.ts:94 (the only call site of redactAttributes in the repo)","why_it_matters":"a secret that surfaces in a shell command's stdout or an HTTP response body is masked in the trace file but written byte-for-byte to ~/.muffin/sessions/*.jsonl."},{"what":"vault secret filtering is a 9-name filename denylist, not content inspection","evidence":"core/vault/vault.ts:74-77 (NEVER_CONTENT), core/vault/vault.ts:58-67 (skipReason)","why_it_matters":"a credential pasted into any ordinarily-named note is chunked, embedded, and becomes recallable into future prompts; the vault never reuses core/tracing/redact.ts's value-shape secret net."},{"what":"budget engine undercounts cache-write tokens on the native Anthropic adapter path","evidence":"core/budget/pricing.ts:74-88 (self-documented, unfixed)","why_it_matters":"the file's own stated safety principle is 'charge high so the cap trips early'; this path does the opposite, so the monthly/daily caps can be crossed later than the numbers suggest."},{"what":"'Sandbox non disponibile -> ALLOW degrades to ASK' is not how degradation actually works","evidence":"agent/runtime.ts:301-304 (shell tool pushed to the tool array only `if (executor.status().available)`)","why_it_matters":"the mechanism the threat model names (a policy-level step-down) does not exist; the real mechanism (tool omission at wiring time) happens to be at least as strict, but a future capability wired differently would not automatically get the documented behaviour."},{"what":"HTTP egress is resolve-then-connect, open to DNS-rebinding between the allowlist check and the actual fetch","evidence":"agent/tools/http.ts:22-24 (self-declared in a code comment, not hidden)","why_it_matters":"an allowlisted hostname whose DNS answer changes between check and connect could reach a private address; declared as an accepted v1 limit rather than fixed."}]},"memory":{"schema":{"file":"core/memory/schema.ts:25 (MEMORY_SCHEMA, the 9 core tables); plus core/memory/vectors.ts:18 (chunks), core/memory/ingest-lock.ts:58 (ingest_lock), core/memory/consolidator.ts:261 (consolidation_runs), core/scheduler/firelog.ts:27 (proactive_fires) — 14 tables total, 5 schema sources","tables":[{"name":"episodes","plane":"evidence","columns":["id INTEGER PK","tenant_id TEXT NOT NULL","connector TEXT NOT NULL — surface that produced it (telegram, vault, cli, ...)","thread_key TEXT NOT NULL — session/conversation id within the connector","actor_id INTEGER REFERENCES identities(id) — who produced it, beyond role; ALWAYS NULL in production, see gaps","role TEXT NOT NULL CHECK IN ('user','agent','tool','system')","kind TEXT NOT NULL CHECK IN ('message','tool_result','document','web','media')","content TEXT — nullable","vault_path TEXT — nullable, set for vault-sourced episodes","media_meta TEXT — nullable JSON (hash/tier/chunk-index for vault docs)","trust_tier INTEGER NOT NULL CHECK BETWEEN 0 AND 3","created_at TEXT NOT NULL","extraction_v INTEGER NOT NULL DEFAULT 0 — pipeline version that last processed this row","superseded_at TEXT — nullable; retires the text (e.g. vault file changed) without deleting the row"],"rowsMeaning":"one append-only record of something said, uploaded or replied — the only source of truth in the whole store; a row is a record that something happened, never itself a belief.","constraints":["CHECK role IN ('user','agent','tool','system')","CHECK kind IN ('message','tool_result','document','web','media') — the 5 real values","CHECK trust_tier BETWEEN 0 AND 3","3 indexes: (tenant_id,created_at), (extraction_v,tenant_id), (tenant_id,vault_path)"],"droppable":false},{"name":"episodes_fts","plane":"evidence","columns":["content — FTS5 virtual table, external-content over episodes(content), content_rowid='id'","tokenize='unicode61 remove_diacritics 2'"],"rowsMeaning":"full-text shadow of episodes.content, kept in sync by AFTER INSERT/AFTER DELETE triggers (schema.ts:57-62); episodes are append-only so no UPDATE trigger exists or is needed.","constraints":["mirrors episodes 1:1 by rowid; never written directly, only via the two triggers"],"droppable":true},{"name":"entities","plane":"graph","columns":["id
