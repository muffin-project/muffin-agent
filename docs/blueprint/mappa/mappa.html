11,"stage":"mark done","file":"core/memory/ingest.ts:237","what":"extraction_v is advanced for that one episode immediately after its own facts+judge calls finish (not at end of batch), so a crash mid-batch replays at most one episode next run."},{"n":12,"stage":"index","file":"core/memory/ingest.ts:272-284 -> core/memory/vectors.ts:106-137","what":"After the loop, any episode/fact text not yet embedded for the current embedder id is embedded and written to chunks/chunks_vec; failures here are retried next run, never lost."},{"n":13,"stage":"duplicate sweep","file":"core/memory/maintenance.ts:132-177, gated at core/memory/consolidator.ts:686-697","what":"Only if the batch added >=1 fact: exact-normalised-string duplicates among currently-active beliefs for the same (subject,predicate,object) are retired to the newest row, via supersede() with valid_to forced to NULL (a duplicate never represents a real world-time boundary)."},{"n":14,"stage":"log","file":"core/memory/consolidator.ts:702-714 -> core/memory/consolidator.ts:333-357 (ConsolidationLog)","what":"One consolidation_runs row per fire (ran, budget, busy, or error) — durable, never deleted; the only way `muffin memory stats`/`muffin doctor` can tell a legitimately-quiet lane from one that never runs."}],"recallPath":[{"n":1,"stage":"invocation","file":"agent/loop.ts:289-298 (automatic, pre-loop) and agent/tools/memory.ts:112-214 (memory_search tool, on-demand mid-turn)","what":"Every turn's own text is recalled automatically before the model sees anything; the model may also call memory_search for a second, purposeful query it could not have anticipated at turn start — the only path that can set asOf/history/surface/since/until/around, since the automatic recall never asks a temporal question. Both paths call core/memory/recall.ts:369 recall(), tenant fixed by the caller, never by the argument list.","note":"memory_search has no tenant parameter at all, by design (agent/tools/memory.ts:22-24) — no prompt can widen its own scope."},{"n":2,"stage":"temporal instant resolved at the boundary","file":"core/memory/recall.ts:108-138 (normaliseDate) and :166-180 (checkTemporalWindow), called from cli/main.ts:505-517 and agent/tools/memory.ts:145-177 before recall() is ever reached","what":"A raw string (YYYY-MM or YYYY-MM-DD) becomes an ISO instant, or is refused outright — a date SQLite cannot compare would otherwise turn every temporal predicate false, and an empty result reads as amnesia rather than as a typo. checkTemporalWindow then refuses two further cases before anything opens: since after until (a window that cannot contain anything) and an asOf that has not happened yet — both shared by the CLI and the tool so the two boundaries cannot drift, and both exempt `EVERY_INSTANT` ('all', what --history resolves to) from the future check, since it sorts after any ISO date lexicographically ('a' > '2').","note":"asOf is one parameter with three states — absent (now), an instant, or 'all' (every instant) — not a boolean beside a date. RecallOptions.includeHistory (a second boolean) was removed; `knowledge/05-person-model.md` names exactly this two-knobs-for-one-idea shape as the antipattern."},{"n":3,"stage":"full-text half","file":"core/memory/recall.ts:396-430 -> core/memory/store.ts:637-677","what":"FTS5 (unicode61, diacritics stripped) over episodes.content, tenant-scoped, limit*2 candidates, SQLite's own bm25-derived `rank`. Superseded episodes are excluded UNLESS asOf is set (includeSuperseded), and surface/since/until narrow the SQL WHERE directly — the (surface, date_range) primitive of `02-ontologia.md` §9.","note":"Exact words; finds the literal term, misses the paraphrase."},{"n":4,"stage":"vector half","file":"core/memory/recall.ts:432-508 -> core/memory/vectors.ts:151-173","what":"k-NN (k=limit*2) within the tenant's own chunks_vec partition (partition key, not a post-filter — vectors.ts:43-50 describes the bug this fixed: a post-filter let a talkative tenant push another tenant's hits out of the k window entirely). A fact hit is read through factById (store.ts:935) rather than a narrower provenance query, so it gets the exact same expired/validFrom/validTo/replacedBy labelling as the graph hop, via the shared successorOf helper (recall.ts:655), and is dropped entirely if retired and includeSuperseded is not set. An episode hit reads connector/supersededAt from provenanceOf (store.ts:903-932) and is dropped if it fails the retirement gate or the surface/since/until filter — the same guarantees the text half enforces in SQL, enforced here in application code because the vector index has no notion of either.","note":"Paraphrase; drifts on names/dates/codes. Degrades to text-only (skips this half, appends 'vector-non-disponibile(...)' to strategies) rather than failing the turn if the embedder is down. Nothing re-embeds a fact or episode on retirement, so its old text stays semantically findable forever — which is exactly why this half needed its own gate rather than inheriting the text half's; see gaps and docs/lessons.md."},{"n":5,"stage":"graph one-hop expansion","file":"core/memory/recall.ts:428-472","what":"Capitalised words in the query (recall.ts:750, extractCandidateNames, deliberately crude — a wrong guess only costs an empty lookup) are looked up as entity names (entitiesByName, store.ts:740). Per matched entity, ONE of three selectors runs, chosen by asOf and nothing else: activeFacts (asOf absent — now), allFacts (asOf:'all' — what --history resolves to), or factsAsOf (asOf a specific instant — store.ts:503-545, the graph as it stood then: a fact matches on its belief window [recorded_at, expired_at) OR a *stated* world-time bound, an unknown bound never excludes but never invents a date either). Results are bounded by selectForExpansion before being fused.","note":"One hop only, by measurement: widening graph expansion on a comparable system cost 44 points on a benchmark (recall.ts:17-19)."},{"n":6,"stage":"the gap — a temporal question the graph cannot answer","file":"core/memory/recall.ts:527-546 (recall()) -> core/memory/store.ts:572-598 (nearestFactTo)","what":"When factsAsOf comes back empty for an entity the text/graph match already found, that is not silence: nearestFactTo finds the closest thing on record by recorded_at, and a RecallGap is appended to RecallResult.gaps naming the entity, the instant asked for, and the nearest belief if one exists. This is the failure this primitive exists to prevent: asked 'who was my contact in May' about an entity whose graph starts in June, recall used to return June's belief with no mark on it — a wrong answer that looks like an answer.","note":"Never a classifier: nothing inspects the query text for 'in May'. The caller (model or CLI flag) states the instant; recall only says what it could and could not find at it — `02-ontologia.md` §9 forbids an 'is this a historical question' classifier by name."},{"n":7,"stage":"bounding the graph hop's membership","file":"core/memory/recall.ts:302-330 (selectForExpansion), EXPANSION_SLOTS=6 (:282), PROTECTED_SLOTS=1 (:300)","what":"At most 6 of an entity's facts reach the fusion: the 6 most recent, plus — if a more-important fact was cut and it beats the weakest of the 6 kept — one swap. Order is always by recency after the swap; importance decided ONLY whether a fact got a seat, never its position."},{"n":8,"stage":"fusion (Reciprocal Rank Fusion)","file":"core/memory/recall.ts:279 (K=60), :389-393 (fuse), :579 (sort)","what":"Every hit from all three halves — text, vector, graph — is scored 1/(60+rank+1) using its rank *within its own half's list*, and summed by a (kind,id) key across halves; the merged map is sorted descending; the turn's own just-recorded input episode is excluded (excludeEpisodeId).","note":"WHAT FUSES: text-rank, vector-rank, graph-expansion-rank, all through the identical formula, no per-source weight or multiplier. WHAT IS DELIBERATELY NOT A SIGNAL: importance never enters this formula — recall.ts:302-321 gives the exact number, promoting a fact from last slot to first in the graph expansion is worth 0.001242 in RRF space, 73% of the threshold at which the field's own research says a fused list silently becomes 'sorted by importance, tie-broken by relevance'. An earlier version DID order the graph expansion by importance and that was the bug being fixed. trust_tier and confidence are likewise absent from the score itself — both only ever affect display/labelling and the turn's inherited taint (recallTaint), never rank."},{"n":9,"stage":"rerank (optional)","file":"core/memory/rerank.ts:47-104, invoked at core/memory/recall.ts:586-591","what":"Only when >= RERANK_MIN_CANDIDATES (12) fused candidates exist: one light-model call reorders the top limit*5 by relevance to the query text; anything the model dropped or an unparseable response leaves out is still appended as a tail rather than lost.","note":"Silently degrades to the RRF order on any provider failure or unparseable response (rerank.ts:64-92) — but recall.ts:588 unconditionally labels the strategy 'rerank(\u003cid>)' once this branch is entered, so a failed rerank is indistinguishable, from the `strategies` field alone, from a successful one. Contrast the vector half, which explicitly reports its own failure (recall.ts:503). See gaps."},{"n":10,"stage":"the neighbourhood — attached after the cut, never inside it","file":"core/memory/recall.ts:593-638 -> core/memory/store.ts:700-731 (episodeNeighbourhood)","what":"When options.neighbours (`around` on the tool) is set, each kept episode item gets up to MAX_NEIGHBOURS=5 (recall.ts:293) episodes before and after it, from its own (connector, thread_key) only — the `vicinato` primitive of `02-ontologia.md` §9. Appended to the survivors with score:0 and neighbourOf:\u003canchorId> rather than fused: a neighbour did not match the query and must not take a slot from, or change the rank of, something that did.","note":"Taint rule: each neighbour carries its OWN trust_tier, so recallTaint's max-over-items already raises the turn to a group neighbour's tier — collapsing the window into the anchor's tier would have been the hole. The count is clamped at the primitive, not only described as small in a comment: options.neighbours is a tool argument the model controls."},{"n":11,"stage":"render for prompt","file":"core/memory/recall.ts:665-704 (renderForPrompt) -> core/memory/spotlight.ts:48-59","what":"Sliced to `limit` (default 8, recall.ts:375). Each item rendered as '[source, temporal-label, origin-mark, intorno-mark] text', a superseded fact's line followed by '↳ sostituito da: \u003csuccessor text>' on its own line, and any RecallGap appended as its own '[lacuna]' line telling the model explicitly not to answer with what holds today — all inside one fence() with a per-render random nonce, so no recalled text can forge the closing delimiter and 'escape' into instruction-space.","note":"Only origin='inferred' is marked ('dedotto — non detto'); 'said' is left unlabelled on purpose, on the theory that a label appearing on every line stops being read (recall.ts:290-292). Same rule for the temporal label (recall.ts:731-748, temporalLabel): a live belief with no stated world time renders bare — the mark is the exception, not the default."},{"n":12,"stage":"taint inheritance","file":"core/memory/recall.ts:708-710 (recallTaint) -> agent/loop.ts:299-300","what":"The turn's taint is raised to the MAXIMUM trust_tier among everything just recalled, before the model is called — a fact a stranger planted months ago taints this turn exactly as if they had just spoken in it."}],"extraction":{"trigger":"agent/loop.ts:805 (deps.onTurnEnd) -> agent/runtime.ts:640 -> core/memory/consolidator.ts:516-535 (Consolidator.notify): arms a 20s idle timer (CONSOLIDATION_IDLE_MS, consolidator.ts:87) after every turn, or fires immediately once 12 turns pass without a qualifying pause (CONSOLIDATION_CEILING, consolidator.ts:109). On fire, execute() (consolidator.ts:637) calls core/memory/ingest.ts:117 ingestPending(). Manual escape hatch: `muffin memory extract` (cli/memory.ts:175-237) drives the identical Consolidator.runNow() path so a hand-typed run cannot diverge from the automatic one.","model":"the 'light lane' — config.models.light, wrapped by agent/providers/light-lane.ts and bound once in agent/runtime.ts:209-213 (billed under principal {kind:'system',source:'consolidation'}, ingest.ts:39-42). The SAME wrapped model instance is reused for extraction (extract.ts), the contradiction judge (judge.ts) and the LLM reranker (rerank.ts) — one lane, three consumers.","whatItProduces":"ExtractedFact[] per episode — {subject, predicate, object, subjectKind, validFrom|null, confidence, matters/charged -> importance 0..2} (extract.ts:25-56) — each then reconciled in core/memory/ingest.ts:304-490 against the subject's current active facts for that predicate: no prior belief -> facts row inserted directly (no judge call, no cost); identical to the current belief -> skipped for free; otherwise -> judged and inserted alongside a coexist/supersede/temporal_scope/review outcome. Everything this pipeline produces has origin='said' by construction (extraction rule 2 forbids inference); 'inferred' is a declared-future producer (the 'observing spine', MVP #5) that does not exist yet.","versioning":"core/memory/schema.ts:40 (episodes.extraction_v, default 0) checked against core/memory/schema.ts:217 (EXTRACTION_VERSION = 1). core/memory/store.ts:218-229 (pendingEpisodes) selects extraction_v \u003c EXTRACTION_VERSION, oldest first. core/memory/store.ts:237-244 (markExtracted) advances it per-episode, called right after that single episode's extraction+judge calls finish (core/memory/ingest.ts:237) rather than at batch end, so a crash replays at most one episode. Bumping EXTRACTION_VERSION re-queues the entire corpus for replay; nothing currently does so (comment at schema.ts:217 states the intent, but there is no code path that increments it programmatically or a CLI verb that forces a full replay)."},"consolidation":{"mechanisms":[{"name":"idle debounce (the flow)","adr":"ADR-0038","file":"core/memory/consolidator.ts:87 (CONSOLIDATION_IDLE_MS=20000), :109 (CONSOLIDATION_CEILING=12), :516-535 (notify)","trigger":"re-armed on every turn for tenant 'host' only; fires 20s after the last turn, or immediately once 12 turns have accumulated without a 20s pause (measured on the owner's own 4-month corpus, not guessed).","cost":"spends tokens — one light-model extraction call per non-skipped episode, plus one light-model judge call per predicate that already has a differing active belief."},{"name":"backlog drain (flow, convergence)","adr":"ADR-0040","file":"core/memory/consolidator.ts:189 (CONSOLIDATION_DRAIN_MS = CONSOLIDATION_IDLE_MS), :717-723 (drainAgain gate: fetched>=limit AND marked>0)","trigger":"self-continues at the same 20s cadence after any fire whose page was both full and made progress, until the backlog is exhausted; always yields to a live turn arriving mid-drain.","cost":"spends tokens, but no more in total than the live lane would have paid anyway — same one extraction per episode, just paid earlier and denser instead of spread out."},{"name":"duplicate sweep (the stock)","adr":"ADR-0040","file":"core/memory/maintenance.ts:132-177 (sweepDuplicates), gated at core/memory/consolidator.ts:678-697 (only when factsAdded>0)","trigger":"runs synchronously at the end of every batch that added at least one fact; retires exact-normalised-string duplicate active beliefs for the same (subject,predicate,object), newest wins, deterministic so two racing processes pick the same survivor and need no lock.","cost":"spends nothing — pure SQL over rows the batch just produced, no model call, no embedding, no network (maintenance.ts:21-25)."},{"name":"review register, read and answered (stock, human-driven)","adr":"ADR-0040","file":"core/memory/maintenance.ts:212-226 (openContradictions), :286-305 (resolveContradiction); cli/memory.ts:256-311 (muffin memory review), :323-343 (muffin memory review keep \u003cfact-id>)","trigger":"not scheduled at all — read on demand by the owner; 'open' is derived (both facts of the pair still active), not a stored status, so a question closes itself the moment the conversation supersedes either fact.","cost":"spends nothing to read; answering costs one supersede() write and no model call — the owner decides, never the model (ADR-0032 §9 kept intact)."}]},"notBuilt":[{"what":"Dream / compaction — profiles and digests, the derived plane's summarization layer","why":"missing the consumer, not the producer: writing a compactor would mean paying model calls to fill a table that no read path queries. 'Prima il lettore, poi lo scrittore' (reader first, writer second).","evidence":"docs/blueprint/adr/0040-la-manutenzione-e-guidata-dai-dati.md:247-251 ('Le tabelle profiles e digests hanno zero scrittori e zero lettori'); confirmed at the code level — core/memory/schema.ts:151-167 declares both tables and repo-wide search finds no INSERT/SELECT against either outside schema.ts itself."},{"what":"Confidence decay","why":"three independent, each-sufficient reasons: (1) no defensible decay rate exists in this corpus's research — the nearest number, LLM overconfidence of 15-27 points, is a constant calibration offset, not a time constant; (2) no reader — the only threshold on confidence anywhere is extract.ts:192 (>=0.4) applied once at write time, after that it is only ever displayed (`muffin memory why`); (3) decaying it would be a DELETE with extra steps — a belief that slides under a recall threshold becomes unrecoverable with no expired_at, no superseded_by, nothing `muffin memory why` can show, which is exactly what 'never delete a row' exists to prevent.","evidence":"docs/blueprint/adr/0040-la-manutenzione-e-guidata-dai-dati.md:215-235"},{"what":"Expiry sweep (world-time closure on facts still believed true, plus entities.expired_at)","why":"nothing to sweep yet: valid_to is written only by supersede() (called from judge verdicts and the duplicate sweep), never by addFact in the one production call site (reconcile). entities.expired_at has no writer at all. Building the sweep now would be a guard that can never fire.","evidence":"docs/blueprint/adr/0040-la-manutenzione-e-guidata-dai-dati.md:237-245; cross-checked in code at core/memory/ingest.ts:323-345 (addFact call omits validTo) and core/memory/store.ts:38-56 (FactInput.validTo exists on the type but reconcile never sets it)"},{"what":"Predicate merge proposals (the second half of the predicate-vocabulary audit)","why":"detection is built (the predicate_vocabulary invariant, warning-only, fires past 80 distinct predicates) but proposing an actual merge needs a synonymy judgment — either a model call (breaks ADR-0040's 'maintenance spends nothing' rule) or a hand-written synonym list (the closed vocabulary ADR-0032 already rejected once). Left open, in roadmap.","evidence":"docs/blueprint/adr/0040-la-manutenzione-e-guidata-dai-dati.md:253-260; detection half at core/memory/invariants.ts:43,110-118 (PREDICATE_VOCABULARY_THRESHOLD=80, calibrated on the old system's 43-predicate/329-edge graph where 26 of 43 were used exactly once)"},{"what":"Cross-connector identity linking (the identities table's proposed -> confirmed flow)","why":"the columns and states are built as structural foundation ('costano zero') but the actual linking flow is deliberately not built until a second remote connector exists to make cross-connector merging a real question — confirmation is required to go through an out-of-band channel (a code generated on one connector, entered on the other), never a same-channel 'yes that's me'.","evidence":"docs/blueprint/10-risoluzioni-fase-c.md:34 ('identities → tabella sì, state-machine no'); docs/blueprint/02-ontologia.md:139"},{"what":"`muffin run` headless does not consolidate live","why":"the idle-debounce timer is deliberately `unref()`'d so a scriptable one-shot command exits immediately after answering instead of hanging around 20s to extract; episodes from a headless run stay pending by construction until the next long-lived process (gateway/REPL) drains them.","evidence":"core/memory/consolidator.ts:576-580 (timer.unref comment); restated as a known, unfixed limitation in docs/blueprint/adr/0040-la-manutenzione-e-guidata-dai-dati.md:262-266"}],"gaps":[{"what":"profiles and digests: zero writers AND zero readers, confirmed at the code level, not just declared in the ADR","evidence":"core/memory/schema.ts:151-167 (declaration only); no match anywhere in core/, agent/, or cli/ (excluding schema.ts itself) for an INSERT into or SELECT from either table","why_it_matters":"one of the architecture's three named planes ('evidence / graph / derived') is, in the running system, pure DDL — a third of the documented memory model does not exist as code. This is the exact 'declared and connected to nothing' pattern the codebase's own comments repeatedly flag by number (store.ts and consolidator.ts both reference it as a running count of prior incidents)."},{"what":"identities has zero production writers; episodes.actor_id and facts.speaker_id — the two foreign keys into it — are consequently always NULL in every live write path","evidence":"no `INSERT INTO identities` outside core/memory/invariants.test.ts:117 (a test fixture); no production `addEpisode` call (agent/loop.ts:273, agent/loop.ts:529, core/vault/vault.ts:238, agent/observe-run.ts:105) ever passes actorId; the one production `addFact` call (core/memory/ingest.ts:324) never passes speakerId","why_it_matters":"the ontology's headline claim for this table — 'one person seen from two connectors is two identities until someone confirms otherwise' — cannot be observed happening anywhere yet, and below the episode's own `role` column, the store has no notion of which specific speaker (in a group of several) said a given thing."},{"what":"entities.summary and entities.expired_at: declared columns, zero writers","evidence":"core/memory/store.ts:295-302 (upsertEntity's INSERT list is tenant_id, kind, name, recorded_at only — summary is absent); entities.expired_at confirmed unwritten in docs/blueprint/adr/0040-la-manutenzione-e-guidata-dai-dati.md:241","why_it_matters":"an entity can never be marked retired/merged, and the one column that could hold a short human-readable gloss of who/what an entity is (useful exactly where `muffin memory why` or recall shows a bare name) is dead weight in the schema."},{"what":"MemoryStore.isFunctional() has zero production call sites — the functional-predicate rule is enforced only offline, never at write time","evidence":"grep across core/, agent/, cli/ for `.isFunctional(` matches only core/memory/store.test.ts:124-125 and core/memory/ingest.test.ts:547; core/memory/ingest.ts's reconcile() (lines 304-490) never calls it, despite a comment at ingest.ts:362 describing what it 'now means'. The only live consumer of functional_predicates is the direct SQL join inside the invariant check (core/memory/invariants.ts:110-118), run by `muffin memory check`, not by the ingest pipeline.","why_it_matters":"the one predicate class the schema calls out as 'must never be a set' (date_of_birth, legal_name, tax_id, place_of_birth) can end up with two simultaneous active values if the judge ever mis-verdicts 'coexist' on one, and nothing refuses or even flags it at write time — only a manually-run, separate health check catches it after the fact."},{"what":"a failed LLM rerank is mislabelled as a successful one in recall's own `strategies` field","evidence":"core/memory/rerank.ts:64-92 (LlmReranker.rerank catches its own provider/parse failures and silently returns candidates.slice(0, topK) — the plain RRF order); core/memory/recall.ts:586-591 pushes the string `rerank(\u003cid>)` onto `strategies` unconditionally once the branch (candidate count >= RERANK_MIN_CANDIDATES) is entered, with no way to observe that rerank() internally fell back","why_it_matters":"RecallResult.strategies is documented as existing precisely so 'a degraded recall is never silent' (core/memory/recall.ts:266-267), and the vector half honors that (it appends `vector-non-disponibile(\u003cerror>)` on failure, recall.ts:503) — but the rerank half does not, so an unreachable reranker looks, from the one field the system exposes for this, identical to a reranker that worked."},{"what":"surface/since/until on the vector half are a post-filter on the fetched k-NN candidates, not a partition inside the index — the same shape as the tenant-isolation bug this file already fixed once, one level down","evidence":"core/memory/recall.ts:432-508: `deps.vectors.search(tenantId, query, limit*2)` fetches by tenant-partitioned similarity only, then surface/since/until/includeSuperseded are applied in application code afterwards. Contrast tenant scoping itself, which vectors.ts:43-50 moved INSIDE the vec0 partition key precisely because a post-filter let a busier tenant push another tenant's hits out of the k window entirely.","why_it_matters":"on a corpus where most chunks are on one surface, a `surface` filter that excludes them can under-fill the k window before the requested `limit` is reached, silently returning fewer semantic matches than exist deeper in the true ranking — narrower than the FTS half, which applies the same filter inside SQL before any cap. Not a tenant leak (the partition key still holds) and not a mislabelling (an excluded hit never reaches the item list unmarked), so it did not meet the bar for a fix inside this slice; worth revisiting if `muffin doctor`/an eval ever shows recall thinning out under a surface filter."}]},"surfaces":{"cli":[{"cmd":"muffin (o: muffin repl)","sub":[],"file":"cli/main.ts:161-162,191-197","what":"Avvia l'agente interattivo: REPL più ogni superficie abilitata.","wired":true,"note":"Bare `muffin` senza config esist /rot/budgets.json:4":{"path":"defaults/rot/budgets.json","line":4,"testo":"\"monthlyUsd\": 80,"},"defaults/rot/budgets.json:5":{"path":"defaults/rot/budgets.json","line":5,"testo":"\"perTenantDailyUsd\": 2,"},"defaults/rot/budgets.json:6":{"path":"defaults/rot/budgets.json","line":6,"testo":"\"quietHours\": { \"from\": \"23:00\", \"to\": \"08:00\", \"timezone\": \"Europe/Rome\" }"},"defaults/rot/egress.json:4":{"path":"defaults/rot/egress.json","line":4,"testo":"\"allow\": []"},"defaults/rot/policy.json:4":{"path":"defaults/rot/policy.json","line":4,"testo":"\"defaultMaxTaint\": { \"low\": 3, \"medium\": 1, \"high\": 1 },"},"defaults/rot/policy.json:5":{"path":"defaults/rot/policy.json","line":6,"testo":"\"neverAtRuntime\": [\"rot.write\"],"},"defaults/rot/policy.json:6":{"path":"defaults/rot/policy.json","line":7,"testo":"\"forbiddenForSystem\": [\"outward.send\", \"config.ratchet\"]"},"docs/blueprint/02-ontologia.md:139":{"path":"docs/blueprint/02-ontologia.md","line":139,"testo":"- **Identità cross-connector** (il problema della community): `identities` per-connector restano separate di default; il link a una `entity` persona avviene solo `proposed→confirmed` — proposta automatica su evidenza forte, conferma dell'owner o dell'interessato **tramite canale out-of-band** (codice generato su un canale e inserito sull'altro: una risposta \"sì sono io\" sul canale nuovo non è una conferma — C1-16). **In v1 la tabella e gli stati esistono ma il flusso non si costruisce** (C2-#2): con un solo connector remoto il merge cross-connector non può accadere; le colonne sono fondamenta strutturali, il flusso arriva col secondo connector. **Mai merge silenzioso**: l'evidenza dice che il falso-positivo di merge è il fallimento peggiore perché invisibile (A4 §9, \"Sakura Sushi\"). Se il sistema sbaglia un link confermato: `link_status` torna `unlinked`, i fatti restano attribuiti alle identità originarie (lo permettono `speaker_id` + provenienza — niente da \"smescolare\")."},"docs/blueprint/03-threat-model.md:121":{"path":"docs/blueprint/03-threat-model.md","line":121,"testo":""},"docs/blueprint/03-threat-model.md:21":{"path":"docs/blueprint/03-threat-model.md","line":21,"testo":"- **Trust tier** (dal modello dati, 02 §5): 0 owner · 1 contatti confermati · 2 gruppo/sconosciuti · 3 web/tool-esterni. Il **taint del contesto** = max tier dei blocchi **fisicamente presenti nel context del turno** (messaggio + recall + tool output già ricevuti). Il taint **si propaga**: messaggio→fatto (il fatto eredita il tier), fatto→recall (l'etichetta viaggia), recall→azione (il kernel legge il taint prima di eseguire). Risposta alla domanda diretta del BRIEF: sì, serve il taint, ed è un campo persistito, non una convenzione di prompt. **Il filesystem locale non ha provenienza** (ADR-0044): `stat` non distingue `~/appunti.md` scritto dall'owner da `~/Downloads/fattura.pdf` arrivato da uno sconosciuto, quindi ciò che entra dal disco — `fs_read`, `fs_list`, lo stdout di `shell_run` — è **tier 2**; la tabella dei processi (`process_list`, solo `comm`) è tier 1, perché sceglierne il contenuto costa a un attaccante l'esecuzione di codice sull'host. Un risultato di tool fatto solo di parole del tool stesso è tier 0, **dichiarato** e non omesso: il campo è obbligatorio, così che «pulito» e «nessuno ha chiesto» non siano più lo stesso valore."},"docs/blueprint/03-threat-model.md:30":{"path":"docs/blueprint/03-threat-model.md","line":30,"testo":"decide(principal, tenant, capability, resource, args, taint) →"},"docs/blueprint/03-threat-model.md:45":{"path":"docs/blueprint/03-threat-model.md","line":45,"testo":"| Shell / filesystem host / processi | ALLOW per classe (HITL) | **ASK** (shell; emendamento owner 2026-08-15/16, ADR-0044 §revisione — vedi nota sotto) | **DENY** |"},"docs/blueprint/03-threat-model.md:51":{"path":"docs/blueprint/03-threat-model.md","line":52,"testo":"- **La riga shell/filesystem/processi a taint 2, emendata (owner, 2026-08-16).** `sys.shell` dichiarava nessun `maxTaint` proprio, quindi ereditava il soffitto di default per `high` risk (1): a taint 2 (`DISK_TIER`, ADR-0044) la riga era un `DENY — nessun percorso`, senza `ask`. L'owner ha scelto la contropartita che ADR-0044 offriva: `sys.shell` ora dichiara `maxTaint: 2` (`agent/tools/shell.ts`), quindi a taint 2 la decisione scende nel ramo `high`-risk invece di fermarsi al soffitto — e quel ramo resta `ask` ovunque non sia `hardened && owner && taint===0`, che un turno che ha letto qualcosa non è mai. Il risultato: *«leggi il file e poi lancia i test»* torna a essere completabile con un sì dell'owner, l'auto-allow resta irraggiungibile dopo una lettura, e l'egress (riga sopra) resta invariato — nessuna capability che *agisce senza chiedere* si è allargata, solo quella che *chiede* è tornata raggiungibile. A taint 3 la riga resta `DENY`: il soffitto si è alzato di un gradino, non è sparito. Dettaglio in ADR-0044 §revisione."},"docs/blueprint/03-threat-model.md:53":{"path":"docs/blueprint/03-threat-model.md","line":54,"testo":"- **`system@scheduler` e `agent@dev` non ereditano la colonna dell'owner** (correzione C1-8): sono principal a sé. Per loro, ogni capability che per l'owner sarebbe ASK/HITL diventa **ASK-in-coda** (l'azione si ferma e attende l'owner al suo rientro), **mai auto-ALLOW perché \"non c'è nessuno da chiedere\"**. Le capability `outward.*` e `config.ratchet` sono escluse del tutto da `system@scheduler` a qualunque taint. Il fail-safe è la direzione obbligata: un'automazione che si blocca è un fastidio, una che si auto-approva è una backdoor."},"docs/blueprint/03-threat-model.md:68":{"path":"docs/blueprint/03-threat-model.md","line":69,"testo":"- **Esecuzione sandboxata di default** per `shell`, `process` e ogni code-execution di `dev`: Seatbelt su macOS, bubblewrap (+socat, seccomp opzionale) su Linux — il modello Claude Code/sandbox-runtime, il più documentato del campo e già adottato dal Muffin attuale come dipendenza. Doppio layer indipendente: filesystem (write-scope = workspace del turno + tmp di sessione) e rete (**allow-only via proxy locale**: namespace di rete rimosso su Linux, sola-porta-proxy su macOS; nessun dominio pre-concesso)."},"docs/blueprint/03-threat-model.md:69":{"path":"docs/blueprint/03-threat-model.md","line":70,"testo":"- **Mandatory deny paths**: `~/.muffin/rot/`, config, secrets, `.git/hooks`, dotfile di shell — negati in scrittura SEMPRE, anche dentro un allow-write ampio (anti config-tampering; complementa i permessi OS del RoT)."},"docs/blueprint/03-threat-model.md:70":{"path":"docs/blueprint/03-threat-model.md","line":71,"testo":"- **Niente side-channel**: il codice dentro il sandbox non ha alcun canale verso i tool del loop — è codice+fs+rete proxata. Il confine di esecuzione è anche un confine di capability. *(Riferimento corretto 2026-08-11: Hermes #4146 era questa classe — sandbox→RPC→tool privilegiato — ma loro l'hanno chiusa TENENDO il canale e propagando l'approvazione giù per i thread (PR #34497); la PR che toglieva la capability fu rifiutata, e la classe si è riaperta due volte (#65592, #74078, aperte a agosto 2026). La nostra scelta è il ramo che loro hanno rifiutato, e la loro storia da allora è l'argomento per il nostro.)*"},"docs/blueprint/04-roadmap.md:210":{"path":"docs/blueprint/04-roadmap.md","line":210,"testo":"`queue`/`steer` e il concetto di \"occupato\" (serve il protocollo client/server"},"docs/blueprint/04-roadmap.md:613":{"path":"docs/blueprint/04-roadmap.md","line":613,"testo":"(`core/budget/budget.ts`), consultati dal kernel; il cap per-turno conta i"},"docs/blueprint/10-risoluzioni-fase-c.md:34":{"path":"docs/blueprint/10-risoluzioni-fase-c.md","line":34,"testo":"- **#2 identities → tabella sì, state-machine no**: le colonne restano (fondamenta strutturali, costano zero), il flusso `proposed→confirmed` non si costruisce finché non esiste il secondo connector remoto."},"docs/blueprint/adr/0040-la-manutenzione-e-guidata-dai-dati.md:215":{"path": /memory/store.ts","line":736,"testo":"entitiesByName(tenantId: string, name: string, limit = 5): { id: number; name: string; kind: string }[] {"},"store.ts:903":{"path":"core/memory/store.ts","line":899,"testo":"* Where a recalled chunk came from and how much it is worth."},"store.ts:935":{"path":"core/memory/store.ts","line":931,"testo":"// recall has nothing else to read it from. Without it an inferred"},"tracer.ts:94":{"path":"core/tracing/tracer.ts","line":94,"testo":"attributes: redactAttributes(current),"},"types.ts:104":{"path":"core/policy/types.ts","line":113,"testo":"*/"},"types.ts:11":{"path":"core/policy/types.ts","line":11,"testo":"export type Principal ="},"types.ts:27":{"path":"core/policy/types.ts","line":27,"testo":"export type TenantId = string;"},"types.ts:40":{"path":"core/policy/types.ts","line":40,"testo":"export type Resource ="},"types.ts:67":{"path":"core/policy/types.ts","line":76,"testo":"/** Already validated against the tool's input schema — never raw model output. */"},"types.ts:69":{"path":"core/policy/types.ts","line":78,"testo":"/** Recomputed at every call, never frozen for the turn (blueprint 03 §2). */"},"updates.ts:81":{"path":"connectors/telegram/updates.ts","line":232,"testo":"accept(updates: { update_id: number }[], receivedAt: string): { stored: number; duplicates: number } {"},"vault.ts:219":{"path":"core/vault/vault.ts","line":219,"testo":"}"},"vault.ts:26":{"path":"core/vault/vault.ts","line":26,"testo":"*"},"vault.ts:58":{"path":"core/vault/vault.ts","line":58,"testo":"* than by how many megabytes of images it carries."},"vectors.ts:43":{"path":"core/memory/vectors.ts","line":43,"testo":"// new version and a re-index — never a silent mix of incompatible vectors."},"vectors.ts:67":{"path":"core/memory/vectors.ts","line":67,"testo":"private migrateUnpartitioned(): void {"},"verify.ts:120":{"path":"core/rot/verify.ts","line":120,"testo":"export function hardeningHolds("}},"generato":"2026-08-26"};</script>
<script>
(() => {
  const D = window.MAPPA;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };

  /* Il taint è l'unica scala di colore della pagina: sale e non scende mai. */
  const TONO = { 0: 'var(--t0)', 1: 'var(--t1)', 2: 'var(--t2)', 3: 'var(--t3)' };
  const RISCHIO = { low: 'var(--t0)', medium: 'var(--t1)', high: 'var(--t3)' };
  const tierDa = (s) => { const m = /tier\s*([0-3])|\b([0-3])\b/i.exec(String(s ?? '')); return m ? Number(m[1] ?? m[2]) : null; };

  /* --- ancore: ogni riferimento file:riga diventa una prova apribile ---- */
  const RIF = /([\w./@-]+\.(?:ts|tsx|mjs|js|md|json|sql|yml|yaml|sh)):(\d+)(?:-(\d+))?/g;
  function ancore(testo) {
    if (!testo) return '';
    const viste = new Set();
    let out = '';
    for (const m of String(testo).matchAll(RIF)) {
      const chiave = `${m[1]}:${m[2]}`;
      if (viste.has(chiave)) continue;
      viste.add(chiave);
      const a = D.ancore[chiave];
      const dove = a ? `${a.path}:${a.line}${m[3] ? '-' + m[3] : ''}` : chiave;
      out += `<button class="ancora" data-copia="${esc(dove)}">${esc(dove)}${a ? `<span class="sorgente">${esc(a.testo)}</span>` : ''}</button>`;
    }
    return out;
  }

  /* --- cassetto -------------------------------------------------------- */
  const cassetto = document.getElementById('cassetto');
  const velo = document.getElementById('velo');
  const dentro = document.getElementById('cassettoInt');
  let ultimoFuoco = null;

  function apri(titolo, occhiello, campi) {
    ultimoFuoco = document.activeElement;
    // Un campo vale se ha testo **oppure** un'ancora: il campo «codice» porta
    // solo riferimenti, ed è quello che rende questa pagina verificabile invece
    // che affermativa. Scartarlo perché il testo è vuoto toglieva la prova da
    // ogni scheda della mappa.
    const righe = campi
      .filter((c) => c && (c.v || c.rif))
      .map((c) => ({ ...c, ancore: c.rif ? ancore(c.rif) : '' }))
      .filter((c) => c.v || c.ancore);
    dentro.innerHTML =
      `<div class="occhiello etichetta">${esc(occhiello)}</div><h3>${esc(titolo)}</h3>` +
      righe.map((c) =>
        `<div class="campo"><span class="etichetta">${esc(c.k)}</span>${c.v ? (c.grezzo ? c.v : `<p>${esc(c.v)}</p>`) : ''}${c.ancore}</div>`
      ).join('');
    cassetto.classList.add('su');
    velo.classList.add('su');
    cassetto.querySelector('.chiudi').focus();
  }
  function chiudi() {
    cassetto.classList.remove('su');
    velo.classList.remove('su');
    if (ultimoFuoco) ultimoFuoco.focus();
  }
  velo.onclick = chiudi;
  cassetto.querySelector('.chiudi').onclick = chiudi;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') chiudi(); });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.ancora');
    if (b && navigator.clipboard) navigator.clipboard.writeText(b.dataset.copia).catch(() => {});
  });

  /* --- disegno del grafo ------------------------------------------------
     Nodi come div assoluti sopra un livello SVG che disegna solo gli archi:
     il testo resta selezionabile e nitido, le curve restano curve.          */
  function grafo(nodi, archi, larghezza, altezza) {
    const t = el(`<div class="tela"><div class="tela-int" style="width:${larghezza}px;height:${altezza}px"><svg width="${larghezza}" height="${altezza}"></svg></div></div>`);
    const int = t.firstElementChild;
    const svg = int.querySelector('svg');
    const mappaNodi = new Map(nodi.map((n) => [n.id, n]));
    const d = [];
    for (const a of archi) {
      const s = mappaNodi.get(a.da), e = mappaNodi.get(a.a);
      if (!s || !e) continue;
      const sx = a.lato === 'destra' ? s.x + s.w : s.x + s.w / 2;
      const sy = a.lato === 'destra' ? s.y + s.h / 2 : s.y + s.h;
      const ex = a.lato === 'destra' ? e.x : e.x + e.w / 2;
      const ey = a.lato === 'destra' ? e.y + e.h / 2 : e.y;
      const path = a.lato === 'destra'
        ? `M${sx},${sy} C${sx + 42},${sy} ${ex - 42},${ey} ${ex},${ey}`
        : a.arco
          ? `M${sx},${sy} C${sx - 120},${sy + 30} ${ex - 120},${ey - 30} ${ex},${ey}`
          : `M${sx},${sy} L${ex},${ey}`;
      d.push(`<path class="arco ${esc(a.tipo ?? '')}" d="${path}" marker-end="url(#p-${esc(a.tipo ?? 'n')})"></path>`);
    }
    const punte = ['n', 'ramo', 'ritorno', 'morto'].map((k) => {
      const c = k === 'ritorno' ? 'var(--accento)' : k === 'morto' ? 'var(--assenza)' : k === 'ramo' ? 'var(--sordo)' : 'var(--linea-forte)';
      return `<marker id="p-${k}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}"></path></marker>`;
    }).join('');
    svg.innerHTML = `<defs>${punte}</defs>${d.join('')}`;
    for (const n of nodi) {
      const b = el(
        `<button class="nodo ${n.classe ?? ''} ${n.tono ? 'pad' : ''}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px" data-cerca="${esc(n.cerca ?? n.titolo)}" data-buco="${n.buco ? 1 : 0}">
           ${n.tono ? `<span class="barra" style="background:${n.tono}"></span>` : ''}
           ${n.n ? `<span class="n">${esc(n.n)}</span>` : ''}
           <div class="t">${esc(n.titolo)}</div>
           ${n.sotto ? `<div class="s">${esc(n.sotto)}</div>` : ''}
         </button>`
      );
      b.onclick = () => { document.querySelectorAll('.nodo.attivo').forEach((x) => x.classList.remove('attivo')); b.classList.add('attivo'); n.apri(); };
      int.appendChild(b);
    }
    return t;
  }

  function scheda({ titolo, sotto, tono, gettoni = [], buco, cerca, apri: onOpen }) {
    const b = el(
      `<button class="scheda" data-cerca="${esc(cerca ?? titolo)}" data-buco="${buco ? 1 : 0}">
         ${tono ? `<span class="barra" style="background:${tono}"></span>` : ''}
         <h4>${esc(titolo)}</h4>
         ${sotto ? `<p>${esc(sotto)}</p>` : ''}
         ${gettoni.length ? `<div class="riga">${gettoni.join('')}</div>` : ''}
       </button>`
    );
    b.onclick = onOpen;
    return b;
  }
  const gettone = (t, colore, vuoto) =>
    `<span class="gettone ${colore ? 'pieno' : ''} ${vuoto ? 'vuoto' : ''}" ${colore ? `style="background:${colore}"` : ''}>${esc(t)}</span>`;

  function sezione(titolo, nota, corpo) {
    const s = el(`<section><h3>${esc(titolo)}</h3>${nota ? `<p class="nota">${esc(nota)}</p>` : ''}</section>`);
    (Array.isArray(corpo) ? corpo : [corpo]).forEach((c) => c && s.appendChild(c));
    return s;
  }
  const griglia = (figli, larga) => { const g = el(`<div class="griglia ${larga ? 'larga' : ''}"></div>`); figli.forEach((f) => g.appendChild(f)); return g; };

  /* ====================================================================
     LE VISTE
     ==================================================================== */
  const viste = {};

  /* --- 1. il percorso di un messaggio ---------------------------------- */
  viste.percorso = () => {
    const f = document.createDocumentFragment();
    f.appendChild(el(`<div class="cappello">
      <h2>Il percorso di un messaggio</h2>
      <p>Dai <strong>${D.loop.entrypoints.length} ingressi</strong> alla risposta, ${D.loop.steps.length} passi reali del codice. La spina scende; i rami tratteggiati sono le uscite anticipate — un rifiuto, un errore, un tetto raggiunto. La freccia ocra che risale è il ciclo delle tool call.</p>
    </div>`));

    f.appendChild(sezione('Da dove entra', null, griglia(D.loop.entrypoints.map((e) =>
      scheda({
        titolo: e.surface, sotto: e.note, tono: 'var(--t0)', cerca: e.surface + ' ' + e.fn,
        gettoni: [gettone(e.fn)],
        apri: () => apri(e.surface, 'ingresso', [{ k: 'funzione', v: e.fn }, { k: 'nota', v: e.note }, { k: 'codice', v: '', grezzo: true, rif: e.file }]),
      })
    ))));

    // Spina verticale, rami a destra. L'altezza di ogni passo dipende da
    // quanti rami porta: così un passo con tre uscite non si accavalla.
    const SX = 20, W = 300, RW = 268, RX = SX + W + 96;
    const nodi = [], archi = [];
    let y = 10;
    const yDi = new Map();
    D.loop.steps.forEach((s, i) => {
      const rami = s.branches ?? [];
      const h = 82;
      nodi.push({
        id: s.id, x: SX, y, w: W, h, n: String(s.n).padStart(2, '0'), titolo: s.title,
        sotto: (s.what ?? '').slice(0, 96) + ((s.what ?? '').length > 96 ? '…' : ''),
        tono: TONO[tierDa(s.taint) ?? 0] ?? 'var(--linea-forte)',
        cerca: [s.title, s.what, s.file].join(' '),
        apri: () => apri(s.title, `passo ${s.n} · ${s.id}`, [
          { k: 'cosa succede', v: s.what },
          { k: 'taint', v: s.taint },
          rami.length ? { k: 'diramazioni', grezzo: true, v: rami.map((r) => `<p><b>se</b> ${esc(r.cond)}<br><span class="mono">→ ${esc(r.goto)}</span> — ${esc(r.note ?? '')}</p>`).join('') } : null,
          { k: 'codice', v: '', grezzo: true, rif: s.file },
        ]),
      });
      yDi.set(s.id, y);
      let ry = y + 4;
      rami.forEach((r, j) => {
        const id = `${s.id}~${j}`;
        nodi.push({
          id, x: RX, y: ry, w: RW, h: 62, classe: 'ramo',
          titolo: r.cond.length > 62 ? r.cond.slice(0, 60) + '…' : r.cond,
          sotto: `→ ${r.goto}`, cerca: [r.cond, r.note, r.goto].join(' '),
          buco: /manca|non esiste|mai|silenzio|vanish/i.test(r.note ?? ''),
          apri: () => apri(r.cond, `diramazione da ${s.id}`, [{ k: 'porta a', v: r.goto }, { k: 'nota', v: r.note }, { k: 'codice', v: '', grezzo: true, rif: r.note }]),
        });
        archi.push({ da: s.id, a: id, lato: 'destra', tipo: 'ramo' });
        if (r.goto && r.goto !== 'exit' && yDi.has(r.goto)) archi.push({ da: id, a: r.goto, tipo: 'ritorno', arco: true });
        ry += 70;
      });
      const prossimo = D.loop.steps[i + 1];
      if (prossimo) archi.push({ da: s.id, a: prossimo.id });
      y += Math.max(h + 26, rami.length * 70 + 20);
    });
    f.appendChild(sezione('La spina', 'Ogni nodo si apre: cosa fa, che taint porta, e la riga di codice che lo prova.', grafo(nodi, archi, RX + RW + 30, y + 20)));

    const c = D.loop.context;
    f.appendChild(sezione('Cosa vede il modello', `Assemblato da ${c.assembleFn}. ${c.totalBudget ?? ''}`, griglia(c.blocks.map((b) =>
      scheda({ titolo: b.name, sotto: b.budget ? `tetto: ${b.budget}` : 'senza tetto', tono: 'var(--t0)', cerca: b.name + ' ' + b.source, apri: () => apri(b.name, 'blocco di contesto', [{ k: 'tetto', v: b.budget ?? 'nessuno' }, { k: 'codice', v: '', grezzo: true, rif: b.source }]) })
    ))));

    const s = D.loop.streaming;
    f.appendChild(sezione('Streaming', null, griglia([
      scheda({ titolo: 'ChatCall.stream', sotto: s.verdict, tono: 'var(--assenza)', buco: !s.consumed, gettoni: [gettone('dichiarato'), gettone(s.consumed ? 'letto' : 'mai letto', null, !s.consumed)], cerca: 'streaming stream', apri: () => apri('streaming', 'dichiarato e non collegato', [{ k: 'verdetto', v: s.verdict }, { k: 'dichiarato in', v: '', grezzo: true, rif: s.declared }, { k: 'consumato da', v: s.consumed ?? 'nessuno' }]) }),
      ...D.loop.providers.map((p) => scheda({ titolo: p.name, sotto: p.wired ? 'cablato' : 'non cablato', tono: p.wired ? 'var(--ok)' : 'var(--assenza)', buco: !p.wired, cerca: p.name, apri: () => apri(p.name, 'provider', [{ k: 'cablato', v: p.wired ? 'sì' : 'no' }, { k: 'codice', v: '', grezzo: true, rif: p.file }]) })),
    ])));

    f.appendChild(sezione('Quando il turno finisce male', null, griglia(D.loop.failurePaths.map((p) =>
      scheda({ titolo: p.what, sotto: p.consequence, tono: 'var(--t3)', buco: true, cerca: p.what + ' ' + p.consequence, apri: () => apri(p.what, 'percorso di fallimento', [{ k: 'conseguenza', v: p.consequence }, { k: 'codice', v: '', grezzo: true, rif: p.evidence }]) })
    ), true)));
    return f;
  };

  /* --- 2. i tool -------------------------------------------------------- */
  viste.tool = () => {
    const f = document.createDocumentFragment();
    const bloccati = D.tools.tools.filter((t) => /draft|rifiut|refus|mai/i.test(t.onDeny ?? '') && /undoable/.test(String(t.reversible)));
    f.appendChild(el(`<div class="cappello">
      <h2>I tool</h2>
      <p><strong>${D.tools.tools.length} tool</strong> per <strong>${D.tools.capabilities.length} capability</strong>. La barra a sinistra è il rischio dichiarato; il gettone <em>tier</em> è quanto il risultato sporca il turno. Un bordo viola vuol dire che quel percorso non esegue.</p>
    </div>`));

    f.appendChild(el(`<div class="legenda">
      <span><i class="pallino" style="background:var(--t0)"></i> rischio basso</span>
      <span><i class="pallino" style="background:var(--t1)"></i> medio</span>
      <span><i class="pallino" style="background:var(--t3)"></i> alto</span>
      <span><i class="pallino" style="background:var(--assenza)"></i> dichiarato e non eseguibile</span>
    </div>`));

    f.appendChild(sezione('Il banco', `Registrati in ${D.tools.registry.file}. ${D.tools.registry.note}`, griglia(D.tools.tools.map((t) => {
      const tier = tierDa(t.taintOut);
      const morto = !t.wired || /mai|non esiste|rifiut/i.test(t.wiredNote ?? '');
      const b = scheda({
        titolo: t.name, sotto: t.oneLine, tono: RISCHIO[t.risk] ?? 'var(--linea-forte)',
        buco: morto, cerca: [t.name, t.capability, t.oneLine, t.taintOut].join(' '),
        gettoni: [
          gettone(t.capability),
          tier !== null ? gettone(`tier ${tier}`, TONO[tier]) : gettone('nessun tier', null, true),
          t.maxTaint !== null && t.maxTaint !== undefined ? gettone(`max ${t.maxTaint}`) : '',
          morto ? gettone('non esegue', null, true) : '',
        ].filter(Boolean),
        apri: () => apri(t.name, `capability ${t.capability}`, [
          { k: 'cosa fa', v: t.oneLine },
          { k: 'parametri', v: (t.params ?? []).join(' · ') },
          { k: 'rischio · reversibilità · tetto di taint', v: `${t.risk} · ${t.reversible} · ${t.maxTaint ?? 'ereditato'}` },
          { k: 'taint che produce', v: t.taintOut, rif: t.taintOut },
          { k: 'quando la policy rifiuta', v: t.onDeny, rif: t.onDeny },
          t.wiredNote ? { k: 'cablaggio', v: t.wiredNote, rif: t.wiredNote } : null,
          { k: 'codice', v: '', grezzo: true, rif: t.file },
        ]),
      });
      if (morto) b.classList.add('nodo', 'spenta');
      return b;
    }), true)));

    if (bloccati.length) {
      f.appendChild(sezione('La primitiva che non scrive mai', 'Il kernel risponde `draft` per ogni capability medium+undoable; il loop rifiuta ogni `draft` perché il registro di undo non esiste. Le due decisioni sono corrette da sole.', griglia(bloccati.map((t) =>
        scheda({ titolo: t.name, sotto: t.onDeny, tono: 'var(--assenza)', buco: true, cerca: t.name + ' draft', apri: () => apri(t.name, 'catena morta', [{ k: 'esito', v: t.onDeny, rif: t.onDeny }, { k: 'codice', v: '', grezzo: true, rif: t.file }]) })
      ), true)));
    }

    f.appendChild(sezione('Le capability dichiarate', null, griglia(D.tools.capabilities.map((c) =>
      scheda({
        titolo: c.id, sotto: c.note, tono: RISCHIO[c.risk] ?? 'var(--linea-forte)', buco: !c.hasTool,
        cerca: c.id + ' ' + c.note,

    f.appendChild(flusso('Come una cosa entra', 'Dal messaggio all\'episodio ai fatti nel grafo.', m.writePath));

  });

  /* --- filtro: cerca + solo-buchi ---------------------------------------- */
  const cerca = document.getElementById('cerca');
  const soloBuchi = document.getElementById('soloBuchi');
  function filtra() {
    const q = cerca.value.trim().toLowerCase();
    const soli = soloBuchi.checked;
    let visti = 0;
    main.querySelectorAll('[data-cerca]').forEach((n) => {
      const testo = (n.dataset.cerca || '').toLowerCase();
      const okQ = !q || testo.includes(q);
      const okB = !soli || n.dataset.buco === '1';
      if (okQ && okB) visti++;
      n.classList.toggle('smorza', !(okQ && okB));
      n.classList.toggle('evidenzia', !!q && okQ && okB);
    });
    // Il filtro agisce sulla vista aperta: senza questo avviso, una ricerca
    // fatta nella sezione sbagliata sembra dire «non esiste».
    document.getElementById('nulla').hidden = visti > 0 || (!q && !soli);
    const altrove = q ? SEZIONI.filter(([id]) => id !== corrente && conta(id, q, soli)) : [];
    document.getElementById('altrove').innerHTML = altrove.length
      ? 'ma c\'è in: ' + altrove.map(([id, nome]) => `<button class="gettone" data-vai="${id}">${esc(nome)}</button>`).join(' ')
      : '';
  }
  /**
   * Quante corrispondenze avrebbe un'altra vista, senza aprirla.
   *
   * L'indice si costruisce una volta per vista e poi resta: ricostruire sei
   * viste a ogni tasto premuto rendeva la ricerca visibilmente lenta con questi
   * dati, ed è una lentezza che cresce col repo.
   */
  const indici = new Map();
  function conta(id, q, soli) {
    if (!indici.has(id)) {
      const tmp = document.createElement('div');
      tmp.appendChild(viste[id]());
      indici.set(id, [...tmp.querySelectorAll('[data-cerca]')].map((n) => ({
        t: (n.dataset.cerca || '').toLowerCase(),
        b: n.dataset.buco === '1',
      })));
    }
    return indici.get(id).filter((x) => (!q || x.t.includes(q)) && (!soli || x.b)).length;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-vai]');
    if (b) vai(b.dataset.vai);
  });
  cerca.oninput = filtra;
  soloBuchi.onchange = filtra;

  vai('apertura');
})();
</script>
