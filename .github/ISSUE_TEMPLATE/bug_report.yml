name: Bug report
description: Report reproducible behavior that conflicts with Muffin's code or documentation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please redact API keys, credentials, private conversations, Muffin Home contents, personal identifiers, and absolute user paths before submitting anything.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What did you run or do? Prefer the smallest repeatable sequence.
      placeholder: Commands or steps, with private values replaced by placeholders.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect, ideally with a documentation or code reference?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the observed output or error after redaction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or `git rev-parse HEAD`.
      placeholder: vX.Y.Z or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS/version and Node version where relevant.
      placeholder: macOS 15 / Ubuntu 24.04; Node 22.x
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional evidence
      description: Logs, minimal fixtures, frequency, regressions, or anything that could falsify a proposed fix. Do not upload real Home/database/secret files.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private conversation/file contents, personal identifiers, and machine-specific private paths from this report.
          required: true
