# Verifica automatica: typecheck + suite, e — solo se verde — accettazione.
#
# Esiste per una ragione precisa, scritta in docs/ORCHESTRATION.md#work-is-claim-oriented: «un
# subagente che dice di aver fatto non è evidenza». Vale per gli umani quanto
# per gli agenti — «i test passano» detto in una PR è un'affermazione, qui
# diventa un fatto che qualcun altro ha eseguito.
#
# ## Il budget, e come non lo bruciamo
#
# Il repo oggi è privato: il piano Free dà 2.000 minuti/mese, e ogni minuto
# speso è nostro. Da quando sarà pubblico i runner standard sono gratuiti e
# illimitati, quindi questo file è tarato sul caso stretto e resterà valido
# quando smetterà di esserlo. Le scelte che tengono basso il conto:
#
#  1. `concurrency` con `cancel-in-progress`: tre push di fila su una PR fanno
#     girare un run, non tre. È il risparmio più grosso e il più facile da
#     dimenticare.
#  2. Trigger su `pull_request` e sul push a `main` soltanto. Senza il secondo
#     vincolo ogni push a una slice pagherebbe **due** run (il push e la PR)
#     per la stessa verifica. Il push su `dev` pagava lo stesso doppio conto a
#     ogni merge: l'albero era già verde nella PR e il merge è condizionato a
#     quel verde, quindi il run ripeteva ciò che era appena stato provato.
#     Finestra accettata e nominata: se `dev` è avanzato tra il run della PR e
#     il merge, il merge commit resta non provato fino alla PR successiva.
#  2b. `paths-ignore`: una PR di soli documenti (blueprint, handoff, mappa) non
#     esercita nulla che la suite copra. `defaults/**` NON è qui dentro:
#     persona/voice/RoT sono prodotto, non documentazione.
#     **`.claude/**` è un'eccezione a metà: va letta con `strumenti.yml`
#     accanto, o si conclude il contrario di quello che è vero.**
#     `vitest.config.ts` non esclude `.claude/` (solo `worktrees/`), quindi i
#     53 test di hook, `deleghe.mjs` e `riconcilia.mjs` stanno nella suite che
#     gira qui sotto — ma questo `paths-ignore` li spegneva proprio sulle PR
#     che cambiavano quei file (la #107 è passata con zero check). Il rimedio
#     non è togliere `.claude/**` di qui, che rimetterebbe sotto CI comandi e
#     impostazioni che non hanno test: è `.github/workflows/strumenti.yml`,
#     che gira solo sui file di `.claude/` che un test copre e costa 42s
#     invece dei ~205s del job `verifica`. Il perché per esteso è in testa a
#     quel file.
#  3. Solo `ubuntu-latest`. macOS conta 10× i minuti e Windows 2×, e non
#     abbiamo ancora una ragione misurata per pagarli — la macchina di sviluppo
#     è macOS e la produzione è una VPS Linux, quindi Linux è il lato che
#     nessuno prova a mano.
#  4. `verifica` resta un job solo: spezzare typecheck e suite in due job
#     raddoppierebbe checkout/setup/`npm ci` senza comprare nulla. Il job in
#     più qui sotto (`accettazione`) è un'altra cosa: gira su un runner suo,
#     paga il suo setup (~40s misurati), e compra il binario vero contro un
#     $HOME finto — che la suite di `verifica` non tocca.
#
# ## L'unione con `accettazione.yml` (2026-09-16), e cosa compra
#
# L'accettazione era un workflow separato che partiva **a ogni push**, in
# parallelo a questo. Misurato sui run di settembre: ~10,7 minuti fatturati a
# push, pagati per intero anche quando `verifica` era rossa — e con agenti che
# iterano, i push rossi non sono rari. I minuti del piano Free erano già
# finiti, quindi ogni minuto fatturato è debito.
#
# Ora `accettazione` è un job di questo workflow con `needs: verifica`: parte
# solo su un albero che ha già passato typecheck e suite. Un push rosso paga
# ~8 minuti invece di ~19; un push verde paga gli stessi minuti di prima.
#
# Il costo, detto e non nascosto: su una PR verde il segnale completo arriva
# in sequenza (~19 min di wall invece di ~11 in parallelo). Accettato
# dall'owner il 16/09. Dal 17/09 il gate locale non esiste più (`scripts/
# merge.ts` rimosso su decisione owner): i check GitHub qui sopra sono
# l'unico segnale automatico, e `npm run ci:local` resta per chi vuole
# rieseguirli in Docker a mano. Quando il repo diventa pubblico e i minuti
# illimitati, tornare al parallelismo è spostare questo job in un workflow
# col trigger di prima: la struttura a job lo rende reversibile senza
# toccare gli step.
#
# Il filtro `branches: [dev, main]` che `accettazione.yml` aveva sul
# `pull_request` sopravvive come `if:` sul job — stesse PR di prima, stessa
# ragione (una PR verso un'altra base non paga l'accettazione).
#
# `timeout-minutes` non è cautela: è il tetto che impedisce a un test appeso di
# mangiarsi il budget del mese mentre nessuno guarda. Quello, e **non** un budget
# di prestazione — la distinzione è scritta per esteso sul job `accettazione`,
# dove lo stesso tetto ha fatto uscire «cancellate» PR verdi due volte in due
# giorni. Qui era a dieci contro durate misurate di 4,9–6,6 minuti, e il
# 04/09/2026 un run è passato a **10:03**: verde per tre secondi. Un gate che si
# decide su tre secondi di runner non sta misurando questo repository.

name: verifica

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # I tre prerequisiti del sandbox su Linux, non uno. Letti nel sorgente di
      # `@anthropic-ai/sandbox-runtime`, non ricordati:
      # `checkDependenciesCommon` (sandbox-manager.js) pretende **ripgrep** —
      # serve a espandere i glob dei deny-path in percorsi concreti per bwrap,
      # ed è Linux-only perché i profili Seatbelt prendono le regex direttamente
      # — e `checkLinuxDependencies` pretende **bwrap** e **socat**, quest'ultimo
      # perché su Linux la rete si chiude con `--unshare-net` e l'unica uscita è
      # un bridge socat verso il proxy di egress. Con uno solo dei tre,
      # `SandboxManager.initialize` lancia «Sandbox dependencies not available»
      # e il contenimento non parte affatto.
      - name: prerequisiti del sandbox Linux (bwrap, socat, ripgrep)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      # Il quarto prerequisito, e non lo sapevamo perché non l'avevamo mai
      # misurato. Primo giro di questa PR, dal log del probe su ubuntu-latest:
      #
      #   "reason": "userns_denied",
      #   "detail": "bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted"
      #
      # È **verbatim** il messaggio della VPS di produzione nella nota di campo
      # 2026-08-04 di ADR-0018. Il runner è Ubuntu 24.04 e porta lo stesso
      # `kernel.apparmor_restrict_unprivileged_userns=1`: senza questo step
      # `bwrap` è installato, in PATH, e non contiene niente — cioè la CI
      # riproduce esattamente la configurazione in cui il sandbox del vecchio
      # Muffin è stato un no-op per due mesi.
      #
      # Il rimedio è quello che il probe stesso stampa, ed è quello applicato
      # alla VPS: un profilo AppArmor dedicato a `bwrap` che concede `userns`.
      # Non il sysctl, che allargherebbe il permesso a tutta la macchina — su
      # un runner effimero sarebbe innocuo, ma allora la CI proverebbe il
      # contenimento in una configurazione che la produzione non ha.
      - name: profilo AppArmor per bwrap (il rimedio che il probe stampa)
        run: |
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      # `npm ci` e non `npm install`: il lockfile è la verità, e un CI che
      # risolve le versioni da sé verifica un albero che nessuno ha in locale.
      - run: npm ci

      # ADR-0078: ADR-0019 prometteva questo controllo ma non è mai esistito —
      # nessuna CI lo implementava. Ora è reale ed entra nel merge gate via
      # ci:local: proprietario/UNLICENSED/mancante fallisce, il copyleft è
      # segnalato nel log (usabile inbound sotto AGPL, ma da sapere).
      - name: licenze delle dipendenze
        run: node scripts/check-dep-licenses.mjs

      - name: typecheck
        run: npx tsc --noEmit

      # Il verdetto del probe in chiaro nel log, prima della suite. Questo file
      # esiste già con una lezione in coda — «ho letto un log invece di fidarmi
      # della spunta, e poi ho creduto alla mia prima spiegazione» — e questo
      # step è quella lezione applicata a se stessa: se il contenimento non è
      # disponibile su questo runner, il log lo dice con la sua ragione, invece
      # di lasciarlo dedurre da un conteggio di test saltati.
      - name: verdetto del probe (bwrap contiene davvero, qui?)
        run: npx tsx -e "import('./core/sandbox/probe.js').then(m => console.log(JSON.stringify(m.probeSandbox(), null, 2)))"

      # Senza pipe, di proposito: `cmd | tail` riporta l'exit status di `tail`.
      # È una regola di questo repo e vale a maggior ragione dove il verde è
      # letto da una macchina.
      #
      # `MUFFIN_REQUIRE_SANDBOX=1` è il motivo per cui questo job può ancora
      # dire qualcosa sul sandbox. Questo runner è l'unico Linux che tocchiamo,
      # e sta al posto della VPS di produzione: qui un contenimento saltato è un
      # difetto, non una proprietà della macchina. Senza la variabile il salto
      # resta un salto (è il caso del portatile macOS su piattaforme che il
      # sandbox non copre); con la variabile diventa rosso, ed è l'unica forma
      # in cui «9 saltati» smette di leggersi come «9 passati».
      # `MUFFIN_REQUIRE_SYSTEMD=1` è la stessa disciplina per l'altro pezzo di
      # produzione: la unit systemd. Il plist ha `plutil -lint` sul portatile;
      # la unit — il file della VPS — aveva solo asserzioni su stringhe, e
      # questo è l'unico runner con `systemd-analyze`. Se il parser sparisse
      # dall'immagine, senza la variabile il test tornerebbe a saltare in
      # silenzio e l'unica verifica reale della unit sparirebbe con lui.
      - name: suite
        env:
          MUFFIN_REQUIRE_SANDBOX: '1'
          MUFFIN_REQUIRE_SYSTEMD: '1'
        run: npx vitest run --reporter=dot

  # -------------------------------------------------------------------------
  # Accettazione: il binario vero, contro un $HOME finto, senza un modello vero.
  #
  # Era `accettazione.yml`, un workflow suo che partiva a ogni push; dal
  # 2026-09-16 è questo job, gated su `verifica` — l'economia è nell'intestazione
  # del file. Ciò che non cambia è il contenuto: ogni step qui sotto è quello
  # che il workflow eseguiva, perché `scripts/ci-local.ts` deriva i comandi del
  # gate locale da questo file e una riscrittura "già che ci siamo" farebbe
  # divergere il gate dal check.
  #
  # Questa suite spawna un processo `node --import tsx cli/main.ts` reale per
  # ogni asserzione, quindi il setup (~40s: checkout, node, apt, npm ci) è una
  # frazione del costo e il corpo sono gli scenari. `fileParallelism: false`
  # nel suo config è una lezione scritta col sangue (timeout flaky sotto
  # contesa), non prudenza generica: non toccarlo per risparmiare minuti.
  # -------------------------------------------------------------------------
  accettazione:
    runs-on: ubuntu-latest
    needs: verifica
    # Il filtro che `accettazione.yml` aveva sul trigger, diventato condizione:
    # su `pull_request` solo verso `dev`/`main` (una PR verso un'altra base non
    # paga l'accettazione); su push a `main` e su dispatch manuale sempre.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["dev", "main"]'), github.base_ref)
    # **Venti, e la ragione è che questo tetto ha già sbagliato due volte.**
    #
    # Il 02/09/2026 era cinque: la suite chiudeva a 5:03, tre PR verdi sono
    # uscite «cancellate» e nessuna per un difetto, e il tetto è passato a dieci.
    # Il 04/09/2026 è successo di nuovo. Misurate, non stimate, le durate degli
    # ultimi run riusciti: 7,1 · 7,8 · 7,9 · 8,0 · 8,2 · 8,7 · 8,8 minuti. Con un
    # tetto a dieci il margine peggiore era del 12%, e tre run su quattro lo
    # hanno superato in una notte di runner lenti — mentre `verifica`, sullo
    # stesso commit, passava a 10:03 contro una norma di 5–6,5 minuti.
    #
    # La lezione non è «alzalo di nuovo di cinque». Un tetto che va rialzato a
    # ogni crescita della suite è **una stima travestita da gate**: quando scatta
    # al 12% sopra la norma non misura più «la suite è rotta», misura «stanotte i
    # runner sono lenti» — e insegna a rilanciare invece che a leggere, che è il
    # contrario di ciò per cui esiste un gate. `timeout-minutes` serve a uccidere
    # un run **appeso**, non a fare da budget di prestazione: per quello ci sono
    # le durate per scenario che il report stampa a ogni giro, che crescono
    # visibilmente senza far diventare rossa una PR che non ha colpe.
    #
    # Venti è quindi generoso di proposito — più del doppio della norma — e resta
    # un tetto vero: una suite che si appende muore comunque, in un tempo che
    # nessun runner lento raggiunge per caso.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # I quattro prerequisiti del sandbox su Linux, identici al job `verifica`
      # qui sopra — due copie divergenti di una configurazione di contenimento
      # sono peggio di nessuna. Il perché di ciascuno è misurato e documentato
      # lì, una volta sola.
      - name: prerequisiti del sandbox Linux (bwrap, socat, ripgrep)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      - name: profilo AppArmor per bwrap (il rimedio che il probe stampa)
        run: |
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - run: npm ci

      # Il sandbox è un **prerequisito di questo job**, non uno sfondo: senza,
      # gli scenari che eseguono aspettano un effetto che il runtime rifiuta
      # correttamente di produrre, e falliscono per timeout con un messaggio che
      # parla d'altro (successo del primo giro di `slice/job-script-only`:
      # «il gateway non ha mai scritto /il sito non risponde/», causa vera
      # «la sandbox non è disponibile su questa macchina»).
      #
      # Quindi il verdetto del probe si legge **prima** della suite e con exit
      # non-zero: un contenimento assente diventa una riga sola, non una diagnosi.
      # È anche l'unico punto in cui questo job vedrebbe il regresso che ha
      # tenuto no-op per due mesi il sandbox del vecchio Muffin (ADR-0018).
      - name: il sandbox contiene davvero, qui?
        run: |
          npx tsx -e "
            import('./core/sandbox/probe.js').then((m) => {
              const p = m.probeSandbox();
              console.log(JSON.stringify(p, null, 2));
              if (!p.available) process.exit(1);
            })
          "

      # Primo gate: uno scenario reale che si rompe fa fallire questo step, e
      # quindi il job. Senza pipe, per la stessa ragione di `verifica`.
      # `--reporter=json --outputFile.json=…` alongside `dot`: the same run
      # feeds the report below, so the suite spawns its real binaries once.
      # Until 2026-08-23 the report re-ran the whole suite as a subprocess and
      # the job crossed `timeout-minutes` with every step green — GitHub marks
      # that `cancelled`, on `dev` too, and a green report in the log was the
      # only way to tell a timeout from a failure.
      - name: suite di accettazione
        run: npx vitest run --config vitest.acceptance.config.ts --reporter=dot --reporter=json --outputFile.json=${{ runner.temp }}/accettazione.json

      # Secondo gate, e non un log informativo. Senza `|| true`: fallisce anche
      # su una riga `READY` dell'inventario senza uno scenario, o con uno
      # scenario ancora `atteso-rosso` — "pronta" e "provata rossa apposta" non
      # possono essere vere insieme (readiness-criteria.md#day-1-ready). Una
      # riga scoperta o riclassificata male diventa rossa **qui**, dove si vede,
      # invece di restare una riga di inventario che nessuno rilegge.
      - name: rapporto per riga
        if: always()
        env:
          MUFFIN_ACCEPT_RESULTS: ${{ runner.temp }}/accettazione.json
        run: npx tsx evals/acceptance/report.ts

# ---------------------------------------------------------------------------
# Correzione, 2026-08-15, e il buco che ha scoperto
#
# Il primo giro di questa CI è passato verde con
# `core/sandbox/executor.test.ts` a «10 test, 9 saltati». Ho dedotto che
# mancasse `bwrap` sul runner e ho aggiunto l'apt-get sopra. **Sbagliato**: il
# secondo giro, con bubblewrap installato, ha dato gli stessi 9 saltati.
#
# Il gate vero è `platform() === 'darwin'` (executor.test.ts:18). Quei nove
# test provano `sandbox-exec` di macOS e si saltano ovunque altro **per
# costruzione**, con una ragione scritta e giusta: *"a skipped containment
# reported as passed is how the previous system shipped a no-op sandbox for two
# months"*.
#
# Quindi il buco non è nella CI, ed è più grosso di quello che sembrava:
#
#   · il contenimento su **Linux** — la piattaforma della VPS di produzione —
#     non è provato da nessun test, su nessuna macchina;
#   · `core/sandbox/probe.ts` non ha **alcun** file di test, e su Linux è
#     esattamente il codice che decide se il sandbox è disponibile.
#
# L'apt-get resta perché è un prerequisito reale — il giorno che esiste un test
# di contenimento per Linux serve, e senza `bwrap` un `muffin doctor` su questo
# runner mentirebbe. Ma non compra ciò che il commit precedente diceva di
# comprare, e questo blocco esiste perché quella frase non resti in piedi.
#
# Lezione, ed è la stessa di ORCHESTRATION.md#work-is-claim-oriented rivolta contro chi scrive:
# ho letto un log invece di fidarmi della spunta — giusto — e poi ho creduto
# alla mia prima spiegazione invece di verificarla. Il secondo passo vale
# quanto il primo.
#
# ---------------------------------------------------------------------------
# Seguito, 2026-08-15 (slice/sandbox-linux) — il buco sopra, chiuso
#
# Il riferimento `executor.test.ts:18` qui sopra è storico: quel gate non
# esiste più. Il file ora decide con `gate`, che su macOS gira sempre e su
# Linux gira quando il probe ha davvero contenuto qualcosa, e la suite di
# contenimento è **una sola** per i due meccanismi — le stesse righe provano
# Seatbelt e bubblewrap, perché due copie di una garanzia divergono.
#
# Le tre cose che questo job compra adesso e prima no:
#
#   1. i nove contenimenti girano su Linux, su questo runner;
#   2. `core/sandbox/probe.test.ts` esiste, e prova il ramo Linux **anche da
#      macOS** (os e child_process mockati): il rilevatore di root, l'ENOENT,
#      il messaggio verbatim di Ubuntu 24.04, e che niente risponde
#      «disponibile» senza un exit zero di bwrap;
#   3. `MUFFIN_REQUIRE_SANDBOX=1` fa fallire il salto invece di contarlo.
#
# E l'apt-get non era un prerequisito, erano tre: senza `socat` e `ripgrep` la
# libreria non inizializza affatto. La riga di prima era vera e incompleta —
# che è il modo in cui questo file ha già sbagliato una volta.
