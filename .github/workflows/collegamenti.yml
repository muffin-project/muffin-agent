# I riferimenti fra documenti non hanno un compilatore, e questo repo ha già
# pagato la loro assenza.
#
# ## Perché un job a parte
#
# Storicamente `ci.yml` ignorava `docs/**` per risparmiare minuti privati.
# Dal source-public la priorità cambia: i check destinati alla branch protection
# devono materializzarsi su ogni PR, perché GitHub lascia Pending un workflow
# richiesto che viene saltato al trigger. Questo job resta separato perché la
# sua claim è stretta e leggibile, non per nascondersi dietro un path filter.
#
# La conseguenza storica è che fino al 2026-08-30 **niente** verificava i
# riferimenti proprio sulle PR che li cambiavano. Il job nacque stretto sui file
# che copriva; in preparazione al source-public il trigger PR è diventato
# intenzionalmente universale, così il check può essere required senza sparire.
#
# Misurato al primo giro, non stimato: vedi il run di questa PR.
#
# ## Cosa copre, e cosa no
#
# `docs/collegamenti.test.ts` sorveglia il **materiale vivo** — prosa che
# governa HEAD, codice, tooling, CI. ADR, evidence e history sono append-only e
# datati: un `§N` scaduto lì dentro è un documento storico che cita com'era il
# mondo allora, e correggerlo sarebbe riscrivere la storia.
#
# Il filtro `paths` rimasto sul **push a main** include anche i sorgenti perché
# la metà dei riferimenti vive nei commenti del codice di prodotto: un filtro sui
# soli `docs/**` avrebbe lasciato fuori proprio i file in cui il drift del
# 19/08 si è depositato. Sulle PR il job gira sempre.

name: collegamenti

on:
  # Required public check: every PR materializes this workflow. Optimize later
  # with job-level conditions, never trigger-level path filters.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - '.claude/**'
      - '.github/workflows/**'
      - 'agent/**'
      - 'cli/**'
      - 'core/**'
      - 'connectors/**'
      - 'evals/**'
      - 'defaults/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collegamenti:
    runs-on: ubuntu-latest
    # Dieci, e il lavoro di questo job è **un secondo e mezzo**: misurato il
    # 04/09/2026, `docs/collegamenti` chiude in 0,69s. Tutto il resto del run
    # è `checkout` + `setup-node` + `npm ci`, cioè
    # rete e cache che non appartengono a questo repo. Con il tetto a cinque
    # minuti il gate misurava npm: due run sono arrivati a 4,6 e 5,3 minuti
    # contro una norma di 0,4–0,7, e il secondo è morto sul tetto senza che una
    # sola asserzione fosse in dubbio. Stessa ragione scritta per esteso in
    # `accettazione.yml`: un tetto uccide un run appeso, non fa da budget.
    timeout-minutes: 10
    steps:
      # Keep these pins aligned with ci.yml; verify the upstream commit before updating.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Senza pipe, per la stessa ragione di `ci.yml`: `cmd | tail` riporta
      # l'exit status di `tail`.
      - name: i riferimenti risolvono
        run: npx vitest run docs/collegamenti --reporter=dot
