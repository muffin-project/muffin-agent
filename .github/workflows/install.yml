# L'installazione è l'unica parte di Muffin che nessuna suite tocca.
#
# `verifica` (ci.yml) e `accettazione` girano dentro un albero **già** clonato,
# già installato con `npm ci`, con Node già messo lì da `actions/setup-node`.
# Cioè: esercitano tutto tranne i tre passi che una VPS vuota deve fare per
# prima — procurarsi Node, procurarsi il codice, diventare un comando — e
# quindi non hanno mai visto `install.sh` per intero. Il 04/09/2026 questo è
# costato all'owner il Muffin installato: `prepare` chiamava uno script
# cancellato, e nessun test è cambiato di colore perché `prepare` gira solo su
# un albero pulito (`scripts/script-che-esistono.test.ts` ha chiuso quel
# singolo buco, non la classe).
#
# Questo job è la classe: `evals/install/ubuntu.sh` fa il giro intero su una
# macchina senza Node — PATH ripulito, HOME usa e getta, il repo servito da un
# origin git locale che punta a **questo** commit — e chiede quattro cose
# osservate, non dedotte: `install.sh` arriva in fondo da solo, `muffin doctor`
# non ha righe rosse, la unit del supervisore esiste ed è accettata da systemd,
# `muffin update` costruisce una release affiancata e `--rollback` torna
# indietro. `evals/install/pipe-tty.sh` copre invece la forma che un container
# headless non può esprimere da solo: il bootstrap pubblico è letto da una pipe
# ma conserva il controlling TTY per il vero installer, così il first-run può
# chiedere segreti/consenso senza trasformare la promessa «one command» in due.
# L'eval isola il bus dell'eventuale systemd utente del runner: quel manager
# appartiene alla home reale e non può caricare la unit scritta nella HOME
# temporanea. Perciò prova `systemd-analyze verify` e avvia il vero `ExecStart`
# in primo piano; non afferma che systemd abbia attivato il servizio o che
# questo sopravviva al logout. Quella prova richiede una VM usa e getta con un
# manager utente associato alla stessa HOME.
#
# ## Il costo, detto e non nascosto
#
# È il job più lento del repository e non c'è modo di renderlo veloce senza
# smettere di provare la cosa: `npm ci` con `better-sqlite3` nativo gira **due
# volte** — una per l'installazione, una dentro la release che `muffin update`
# costruisce — più il download del tarball di Node. Il tetto è quindi alto di
# proposito: un `timeout-minutes` non è un budget, è ciò che uccide un run
# appeso (stessa ragione scritta per esteso in `accettazione.yml`).
#
# ## Required check vs push filter
#
# Dal source-public questo job deve esistere su ogni PR, perché un workflow
# required saltato da `paths` resta Pending e può bloccare il merge. Per questo
# il trigger `pull_request` è intenzionalmente senza filtro. Il filtro qui sotto
# resta solo sul push a `main`, dove evita replay inutili quando l'installazione
# non può essere stata toccata. Se in futuro vogliamo evitare il job su PR non
# rilevanti, va fatto con una condizione di job che conclude `skipped`, non
# spegnendo il workflow al trigger.

name: install

on:
  # Required public check: every PR materializes this workflow. Optimize later
  # with job-level conditions, never trigger-level path filters.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'bootstrap.sh'
      - 'install.sh'
      - 'evals/install/**'
      - 'cli/**'
      - 'core/gateway/**'
      - 'core/config/config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/install.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # `fetch-depth: 0` e non il default 1: la prova crea un origin git da
      # questo checkout e ci fa girare `muffin update`, che conta i commit fra
      # due sha. Con un clone superficiale quel conteggio non ha una storia da
      # attraversare.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Serve al runner (e a `scripts/ci-local.ts`, che deriva da qui quale Node
      # installare nel container), NON alla prova: `evals/install/ubuntu.sh`
      # costruisce un PATH ripulito da cui `node` è irraggiungibile, e si
      # rifiuta di proseguire se lo trova ancora. È esattamente il prerequisito
      # che `install.sh` deve risolvere da solo.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # systemd per `systemd-analyze verify`, che è il pezzo di verifica della
      # unit che un container può davvero fare (stessa ragione per cui
      # `evals/acceptance/gate-linux.sh` lo installa).
      - name: systemd, per verificare la unit
        run: sudo apt-get update -qq && sudo apt-get install -y -qq systemd

      - name: la pipe pubblica conserva il controlling tty
        run: bash evals/install/pipe-tty.sh

      - name: il tarball di Node è verificato prima dell'estrazione
        run: bash evals/install/node-checksum.sh

      - name: installazione da macchina vuota, unità, update e rollback
        run: bash evals/install/ubuntu.sh
