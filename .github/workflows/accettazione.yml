# Accettazione: il binario vero, contro un $HOME finto, senza un modello vero.
#
# Separato da `ci.yml` per una ragione di costo diversa da quella che tiene
# `ci.yml` a un job solo. Lì il vincolo era il tempo di install (`npm ci` pagato
# due volte). Qui è la frequenza: questa suite spawna un processo `node --import
# tsx cli/main.ts` reale per ogni asserzione — misurato in locale, 17 scenari in
# ~60s — quindi un job condiviso la pagherebbe a ogni push.
#
# ## Il sandbox Linux serve, e la ragione è cambiata (2026-08-25)
#
# Fino a `slice/job-script-only` questo file diceva che la suite «non ha bisogno
# del sandbox Linux che `ci.yml` prepara (nessuno scenario qui chiama
# `shell_run`)». Era vero e ha smesso di esserlo nello stesso commit in cui è
# nato il job script: uno script schedulato **è** esecuzione contenuta, e senza
# sandbox il runtime fa la cosa giusta — rifiuta di eseguirlo — che però lascia
# lo scenario ad aspettare un effetto che non arriverà mai.
#
# La lezione non è «aggiungi un apt-get». È che lo scenario passava su macOS,
# dove `sandbox-exec` c'è sempre, e falliva su Linux, dove Muffin andrà davvero
# a vivere: la piattaforma di destinazione è **Linux, poi** macOS, e una prova
# verde solo sulla macchina di sviluppo prova la piattaforma che non conta.
# Questi step sono gli stessi quattro di `ci.yml` — tre pacchetti e il profilo
# AppArmor — per la stessa ragione documentata lì, e la loro assenza qui era la
# differenza fra le due configurazioni.
#
# `pull_request` (verso `dev`/`main`) è nel trigger; il `push` copre solo
# `main` — per il push su `dev` e i `paths-ignore` vale il ragionamento al
# punto 2/2b di `ci.yml` (crediti agli sgoccioli, stesso giorno).
# Decisione dell'orchestratore (PR #54, giro 2) — reversibile, non policy di
# prodotto: prima era deliberatamente assente (vedi git blame), e senza di lei
# uno scenario rotto o una riga `READY` senza prova restavano invisibili fino
# al merge su `dev`, dove tornare indietro costa più che fermarli prima. Se il
# costo misurato in pratica (un owner che itera dieci volte su una PR)
# risultasse un problema, restringerlo è una riga — ma si misura, non si
# assume.
#
# `npx tsx evals/acceptance/report.ts` (ultimo step, senza `|| true`) è il
# **secondo** gate del job, non solo un log informativo: fallisce anche su una
# riga `READY` dell'inventario senza uno scenario, o con uno scenario ancora
# `atteso-rosso` — "pronta" e "provata rossa apposta" non possono essere vere
# insieme (readiness-criteria.md#day-1-ready). Conseguenza nota, non silenziosa: oggi restano
# sette righe già `READY` senza scenario qui (B14, C2, C3, C6, C7, D4, D6 —
# dettaglio in `docs/work/day1/requirements-status.md`), che un'altra slice in corso
# (`slice/triage-day1`) riclassifica; finché non è integrata questo step resta
# rosso su `dev` **per verità, non per rottura** — vedi la PR che ha introdotto
# questo trigger (#54).

name: accettazione

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accettazione:
    runs-on: ubuntu-latest
    # Dieci e non cinque, misurato il 02/09/2026: con le journey DAY-1 (#283,
    # #285, #286) la suite passa 40/40 e chiude a 5:03 — un minuto sopra il
    # tetto, che GitHub segnala come `cancelled`, non come rosso. Tre PR verdi
    # nel log sono state «cancellate» per questa ragione e nessuna per un
    # difetto. Il tetto resta: un run che si appende deve morire; deve solo
    # essere più alto della suite che protegge.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # I quattro prerequisiti del sandbox su Linux. Il perché di ciascuno è in
      # `ci.yml`, dove sono stati misurati la prima volta; qui non si ripete, si
      # tiene identico — due copie divergenti di una configurazione di
      # contenimento sono peggio di nessuna.
      - name: prerequisiti del sandbox Linux (bwrap, socat, ripgrep)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      - name: profilo AppArmor per bwrap (il rimedio che il probe stampa)
        run: |
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - run: npm ci

      # Il sandbox è un **prerequisito di questo job**, non uno sfondo: senza,
      # gli scenari che eseguono aspettano un effetto che il runtime rifiuta
      # correttamente di produrre, e falliscono per timeout con un messaggio che
      # parla d'altro (successo del primo giro di `slice/job-script-only`:
      # «il gateway non ha mai scritto /il sito non risponde/», causa vera
      # «la sandbox non è disponibile su questa macchina»).
      #
      # Quindi il verdetto del probe si legge **prima** della suite e con exit
      # non-zero: un contenimento assente diventa una riga sola, non una diagnosi.
      # È anche l'unico punto in cui questo job vedrebbe il regresso che ha
      # tenuto no-op per due mesi il sandbox del vecchio Muffin (ADR-0018).
      - name: il sandbox contiene davvero, qui?
        run: |
          npx tsx -e "
            import('./core/sandbox/probe.js').then((m) => {
              const p = m.probeSandbox();
              console.log(JSON.stringify(p, null, 2));
              if (!p.available) process.exit(1);
            })
          "

      # Primo gate: uno scenario reale che si rompe fa fallire questo step, e
      # quindi il job. Senza pipe, per la stessa ragione di `ci.yml`.
      # `--reporter=json --outputFile.json=…` alongside `dot`: the same run
      # feeds the report below, so the suite spawns its real binaries once.
      # Until 2026-08-23 the report re-ran the whole suite as a subprocess and
      # the job crossed `timeout-minutes` with every step green — GitHub marks
      # that `cancelled`, on `dev` too, and a green report in the log was the
      # only way to tell a timeout from a failure.
      - name: suite di accettazione
        run: npx vitest run --config vitest.acceptance.config.ts --reporter=dot --reporter=json --outputFile.json=${{ runner.temp }}/accettazione.json

      # Secondo gate — vedi il commento in testa al file. Senza `|| true`: una
      # riga READY scoperta, o READY con uno scenario ancora atteso-rosso, ora
      # fa fallire questo step e quindi il job, non solo il log.
      - name: rapporto per riga
        if: always()
        env:
          MUFFIN_ACCEPT_RESULTS: ${{ runner.temp }}/accettazione.json
        run: npx tsx evals/acceptance/report.ts
